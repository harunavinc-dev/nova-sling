  try{

  else if(id==='hud_shop'||id==='shop'||id==='dead_shop'){phase='SHOP';shopTab='ships';shopScroll=0;}
  else if(id.startsWith('premium_ship_')){showPremiumModal(id.slice(13));}
  else if(id==='premium_modal_close'){hidePremiumModal();}
  else if(id==='hud_home'){phase='MENU';}
  else if(id.startsWith('lang_')){setLang(id.slice(5));}
  else if(id==='leaderboard'){phase='LEADERBOARD';loadLeaderboard();}
  else if(id==='lb_back'||id==='shop_back')phase='MENU';
  else if(id==='hud_lang'){paused=true;pauseLangOpen=true;}
  else if(id==='hud_pause'){paused=!paused;if(!paused)pauseLangOpen=false;}
  else if(id==='pause_lang_tab'){pauseLangOpen=!pauseLangOpen;}
  else if(id==='hud_mute'){Audio.muted=!Audio.muted;if(Audio.muted)Audio.blackholeStop();}
  else if(id==='change_nick'){showNickOverlay();}
  else if(id==='tab_ships')shopTab='ships';
  else if(id==='restart')initGame();
  else if(id.startsWith('buy_ship_')){
    const sid=id.slice(9),ship=SHIPS.find(s=>s.id===sid);if(!ship)return;
    if(ownedShips.includes(sid)){selShip=sid;saveAll();}
    else if(coins>=ship.price){coins-=ship.price;ownedShips.push(sid);selShip=sid;saveAll();}
  }
}

// ── Spawn ──────────────────────────────────────────────────────────────────
function spawnPlanets(topY,n){
  let cy=topY;
  let lastType=null;
  for(let i=0;i<n;i++){
    const km=Math.max(0,Math.floor((startY-cy)/10));
    const z=getZone(km);
    // Pick type — never spawn black hole twice in a row
    let type;
    const pool=z.types.filter(t=>!(t==='black'&&lastType==='black'));
    type=pool[ri(0,pool.length-1)];
    lastType=type;
    cy-=rnd(...z.sp);
    // Enforce minimum gap after black hole
    if(type==='black')cy-=rnd(80,140);
    const x=rnd(W*0.1,W*0.9);
    // Subtype for blue planets
    const subtype=type==='blue'?SOLAR_PLANETS[ri(0,SOLAR_PLANETS.length-1)]:type;
    // Size: sun bigger, saturn bigger for rings
    const r=type==='black'?ri(22,32):type==='red'?ri(44,62):
      subtype==='jupiter'?ri(36,48):subtype==='saturn'?ri(32,42):
      subtype==='neptune'?ri(28,36):subtype==='uranus'?ri(26,34):
      subtype==='mercury'||subtype==='moon'?ri(14,22):ri(22,32);
    // Belt only on Saturn
    const hasBelt=subtype==='saturn';
    const beltR=hasBelt?r+rnd(...z.br):0;
    const beltAsts=[];
    if(hasBelt){const nb=ri(...z.ba);for(let j=0;j<nb;j++)beltAsts.push({ang:(j/nb)*Math.PI*2,spd:rnd(0.006,0.024)*(Math.random()<0.5?1:-1),sz:ri(4,9)});}
    const hasMover=z.id>=2&&Math.random()<0.3;
    const movers=[];
    if(hasMover){for(let j=0;j<ri(2,5);j++)movers.push({x:rnd(W*0.05,W*0.95),y:cy+rnd(-150,150),vx:rnd(-1.3,1.3),vy:rnd(-0.5,0.5),sz:ri(7,14)});}
    planets.push({x,y:cy,r,type,subtype,pal:PPAL[type],
      gravR:type==='black'?260*z.gm:0,heatR:type==='red'?0.006*z.hm:0,
      hasBelt,beltR,beltAsts,movers,
      rotA:rnd(0,Math.PI*2),pulse:rnd(0,Math.PI*2),zid:z.id});
  }
}

function checkZone(force=false){
  const z=getZone(scoreKm);
  if(z.id!==curZoneId||force){
    const prev=curZoneId;curZoneId=z.id;tBgCol=z.sky;
    if(z.id>prev)Audio.zoneChange();
    if(!force&&prev>=0){
      const bonus=z.mult*150;score+=bonus;
      announce={on:true,life:3.5,zone:z,bonus:`+${bonus} BÖLGE BONUSU`};
      flashAlpha=0.55;flashCol=z.wc;shakeX=rnd(-7,7);shakeY=rnd(-7,7);
    } else if(force){bgCol=z.sky;announce={on:true,life:2.5,zone:z,bonus:''};}
  }
}

// ── Orbit ──────────────────────────────────────────────────────────────────
const MAX_SPIN_MULT=3.5; // max speed multiplier from spinning
const SPIN_PER_ROT=0.55; // multiplier gained per full rotation

function tryGrab(){
  let best_=null,bestD=ROPE_LEN;
  for(const p of planets){
    const dd=d2(probe.x,probe.y,p.x,p.y);
    if(dd<ROPE_LEN&&dd>p.r+PROBE_R*2&&dd<bestD){bestD=dd;best_=p;}
  }
  if(best_){
    const dx=probe.x-best_.x,dy=probe.y-best_.y;
    const r=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx);
    let omega=(probe.vx*(-Math.sin(ang))+probe.vy*Math.cos(ang))/r;
    if(Math.abs(omega)<0.03)omega=0.04*(omega<0?-1:1);
    omega=clamp(omega,-0.14,0.14);
    orb={
      planet:best_,ang,r,omega,heat:0,
      rotations:0,          // full rotations completed
      angAccum:0,           // accumulated angle (absolute)
      spinMult:1.0,         // speed multiplier built up by spinning
      graceTime: best_.type==='black' ? 1.8 : 0, // black hole escape window (seconds)
      warned:false,
    };
    phase='ORBITING';
    emitSpark(probe.x,probe.y,14,trailCol(),2.5);
    if(best_.type==='black')Audio.blackholeStart();
  }
}

function release(){
  if(!orb)return;
  const{ang,r,omega,spinMult}=orb;
  // Exit speed boosted by spin multiplier
  const baseSpd=Math.abs(omega*r);
  const spd=clamp(baseSpd*spinMult,1.8,MAX_SPEED*spinMult*0.6);
  const dir=omega>0?1:-1;
  probe.vx=-Math.sin(ang)*spd*dir;probe.vy=Math.cos(ang)*spd*dir;
  if(lastOrbitPlanet!==orb.planet)lastOrbitPlanet=orb.planet;
  score+=getZone(scoreKm).mult;
  if(orb.rotations>=1)score+=Math.floor(orb.rotations*orb.spinMult*10*getZone(scoreKm).mult);
  if(orb.planet.type==='black')Audio.blackholeStop();
  orb=null;phase='FLYING';
  Audio.sling();
  emitSpark(probe.x,probe.y,Math.floor(18+spinMult*8),trailCol(),2.5+spinMult);
}

// ── Particles ──────────────────────────────────────────────────────────────
const SPARK_MAX=120;
function emitSpark(x,y,n,col,spd){
  const add=Math.min(n, SPARK_MAX-sparks.length);
  for(let i=0;i<add;i++){const a=rnd(0,Math.PI*2);sparks.push({x,y,vx:Math.cos(a)*rnd(0.5,spd),vy:Math.sin(a)*rnd(0.5,spd),life:1,col,sz:ri(2,4)});}
}


let _cachedTrailCol='#00ccff';
let _cachedTrailShip='';
let _cachedShipDef=SHIPS[0];
function trailCol(t){
  if(selShip!==_cachedTrailShip){
    _cachedTrailShip=selShip;
    _cachedShipDef=SHIPS.find(s=>s.id===selShip)||SHIPS[0];
    _cachedTrailCol=_cachedShipDef.trailCol||'#00ccff';
  }
  return _cachedTrailCol;
}
function selShipDef(){
  if(selShip!==_cachedTrailShip)trailCol(0);
  return _cachedShipDef;
}

// ── Death ──────────────────────────────────────────────────────────────────
function die(reason){
  if(reason==='planet'){Audio.death();emitSpark(probe.x,probe.y,60,'#ff6622',8);emitSpark(probe.x,probe.y,40,'#ffaa00',5);}
  else if(reason==='oob')Audio.death();
  else if(reason==='burn'){Audio.heatWarning();setTimeout(()=>Audio.death(),100);emitSpark(probe.x,probe.y,50,'#ff8800',7);}
  else if(reason==='blackhole'){Audio.blackholeStop();Audio.death();emitSpark(probe.x,probe.y,50,'#cc00ff',6);}
  else if(reason==='asteroid'){Audio.asteroid();emitSpark(probe.x,probe.y,45,'#ffaa44',7);}
  if(orb&&orb.planet.type==='black')Audio.blackholeStop();
  if(score>best){best=score;save('best',best);}
  earnedCoins=Math.max(5,Math.floor(scoreKm*0.6+score*0.02));
  coins+=earnedCoins;saveAll();
  phase='DEAD';orb=null;flashAlpha=1;flashCol='#ff2200';shakeX=rnd(-10,10);shakeY=rnd(-10,10);
  const msgs=T_.death;
  deathMsg=T_.death[reason]||T_.death.planet;
  emitSpark(probe.x,probe.y,80,reason==='blackhole'?'#cc00ff':reason==='asteroid'?'#ffaa00':'#ff4400',6);
  if(score>0)submitScore(nickname||'Anonim',score,scoreKm);
}

// ── Update ─────────────────────────────────────────────────────────────────
function update(ts){
  const dt=Math.min((ts-lastT)/16.67,3);lastT=ts;tick++;
  if(paused||phase!=='FLYING'&&phase!=='ORBITING')return;

  bgCol=lerpHex(bgCol,tBgCol,0.018);
  if(announce.on){announce.life-=dt*0.017*60;if(announce.life<=0)announce.on=false;}
  flashAlpha=Math.max(0,flashAlpha-0.035*dt);
  shakeX*=Math.pow(0.84,dt);shakeY*=Math.pow(0.84,dt);

  if(phase==='FLYING'){
    if(holding)tryGrab();
    for(const p of planets){
      if(p.type==='black'&&p.gravR>0){
        const dx=p.x-probe.x,dy=p.y-probe.y,dd=Math.sqrt(dx*dx+dy*dy);
        if(dd<p.gravR&&dd>1){const f=0.28*(1-dd/p.gravR)*dt;probe.vx+=(dx/dd)*f;probe.vy+=(dy/dd)*f;}
      }
    }
    probe.x+=probe.vx*dt;probe.y+=probe.vy*dt;
    probe.vx*=Math.pow(0.9985,dt);probe.vy*=Math.pow(0.9985,dt);
    const spd=Math.sqrt(probe.vx**2+probe.vy**2);if(spd<0.72){const s=0.72/spd;probe.vx*=s;probe.vy*=s;}
    probe.ang=Math.atan2(probe.vy,probe.vx);

    // Record trail from ship tail, not center
    const _tS=selShipDef().S||7.5;
    const _tOff=_tS*4.5*0.3;
    const _tx=probe.x-Math.cos(probe.ang)*_tOff;
    const _ty=probe.y-Math.sin(probe.ang)*_tOff;
    // Dual/quad exhaust for ships with dualExhaust/quadExhaust flag
    const _shipDef2=selShipDef();
    const _isDual=_shipDef2?.dualExhaust;
    const _isQuad=_shipDef2?.quadExhaust;
    if(_isQuad){
      const _perp=probe.ang+Math.PI*0.5;
      const _eOffA=_tS*4.5*0.28; const _eOffB=_tS*4.5*0.09;
      const pushTrail=(arr,x,y)=>{arr.push({x,y});if(arr.length>TRAIL_LEN)arr.shift();};
      const cx_=Math.cos(_perp),cy_=Math.sin(_perp);
      pushTrail(probe.trail, _tx+cx_*_eOffA, _ty+cy_*_eOffA);
      pushTrail(probe.trail2,_tx+cx_*_eOffB, _ty+cy_*_eOffB);
      pushTrail(probe.trail3,_tx-cx_*_eOffB, _ty-cy_*_eOffB);
      pushTrail(probe.trail4,_tx-cx_*_eOffA, _ty-cy_*_eOffA);
    } else if(_isDual){
      const _perp=probe.ang+Math.PI*0.5;
      const _eOff=_tS*4.5*0.22;
      const _tx2a=_tx+Math.cos(_perp)*_eOff; const _ty2a=_ty+Math.sin(_perp)*_eOff;
      const _tx2b=_tx-Math.cos(_perp)*_eOff; const _ty2b=_ty-Math.sin(_perp)*_eOff;
      probe.trail.push({x:_tx2a,y:_ty2a});if(probe.trail.length>TRAIL_LEN)probe.trail.shift();
      probe.trail2.push({x:_tx2b,y:_ty2b});if(probe.trail2.length>TRAIL_LEN)probe.trail2.shift();
    } else {
      probe.trail.push({x:_tx,y:_ty});if(probe.trail.length>TRAIL_LEN)probe.trail.shift();
    }

    const nkm=Math.max(0,Math.floor((startY-probe.y)/10));
    const z=getZone(scoreKm);
    if(nkm>scoreKm){scoreKm=nkm;score=Math.max(score,nkm*z.mult);checkZone();}
    if(probe.x<-160||probe.x>W+160)die('oob');
    for(const p of planets){
      if(d2(probe.x,probe.y,p.x,p.y)<p.r+PROBE_R)die('planet');
      for(const a of p.beltAsts){const ax=p.x+Math.cos(a.ang)*p.beltR,ay=p.y+Math.sin(a.ang)*p.beltR;if(d2(probe.x,probe.y,ax,ay)<a.sz+PROBE_R)die('asteroid');}
      for(const mv of p.movers){if(d2(probe.x,probe.y,mv.x,mv.y)<mv.sz+PROBE_R)die('asteroid');}
    }
    const top=planets.reduce((m,p)=>p.y<m?p.y:m,probe.y);
    if(probe.y-H*2<top)spawnPlanets(top,7);
    planets=planets.filter(p=>p.y<probe.y+H*2.5);
  } else if(phase==='ORBITING'){
    const p=orb.planet;

    // Spin-up: angular velocity increases each frame (non-black-hole)
    if(p.type!=='black'){
      const sign=orb.omega>0?1:-1;
      orb.omega+=sign*0.0015*dt;
      orb.omega=clamp(orb.omega,-0.28,0.28);
    }

    // Track accumulated angle to count rotations
    orb.angAccum=(orb.angAccum||0)+Math.abs(orb.omega*dt);
    const prevRot=Math.floor(orb.rotations||0);
    orb.rotations=orb.angAccum/(Math.PI*2);
    if(Math.floor(orb.rotations)>prevRot){
      orb.spinMult=Math.min(MAX_SPIN_MULT,1+(Math.floor(orb.rotations)*SPIN_PER_ROT));
      emitSpark(probe.x,probe.y,6,trailCol(),orb.spinMult);
    }

    orb.ang+=orb.omega*dt;
    probe.x=p.x+Math.cos(orb.ang)*orb.r;probe.y=p.y+Math.sin(orb.ang)*orb.r;
    // Ship faces tangent direction of orbit (parallel to planet surface)
    probe.ang=orb.ang+(orb.omega>0?Math.PI/2:-Math.PI/2);

    // Record trail from ship tail, not center
    const _tS=selShipDef().S||7.5;
    const _tOff=_tS*4.5*0.3;
    const _tx=probe.x-Math.cos(probe.ang)*_tOff;
    const _ty=probe.y-Math.sin(probe.ang)*_tOff;
    // Dual/quad exhaust for ships with dualExhaust/quadExhaust flag
    const _shipDef2=selShipDef();
    const _isDual=_shipDef2?.dualExhaust;
    const _isQuad=_shipDef2?.quadExhaust;
    if(_isQuad){
      const _perp=probe.ang+Math.PI*0.5;
      const _eOffA=_tS*4.5*0.28; const _eOffB=_tS*4.5*0.09;
      const pushTrail=(arr,x,y)=>{arr.push({x,y});if(arr.length>TRAIL_LEN)arr.shift();};
      const cx_=Math.cos(_perp),cy_=Math.sin(_perp);
      pushTrail(probe.trail, _tx+cx_*_eOffA, _ty+cy_*_eOffA);
      pushTrail(probe.trail2,_tx+cx_*_eOffB, _ty+cy_*_eOffB);
      pushTrail(probe.trail3,_tx-cx_*_eOffB, _ty-cy_*_eOffB);
      pushTrail(probe.trail4,_tx-cx_*_eOffA, _ty-cy_*_eOffA);
    } else if(_isDual){
      const _perp=probe.ang+Math.PI*0.5;
      const _eOff=_tS*4.5*0.22;
      const _tx2a=_tx+Math.cos(_perp)*_eOff; const _ty2a=_ty+Math.sin(_perp)*_eOff;
      const _tx2b=_tx-Math.cos(_perp)*_eOff; const _ty2b=_ty-Math.sin(_perp)*_eOff;
      probe.trail.push({x:_tx2a,y:_ty2a});if(probe.trail.length>TRAIL_LEN)probe.trail.shift();
      probe.trail2.push({x:_tx2b,y:_ty2b});if(probe.trail2.length>TRAIL_LEN)probe.trail2.shift();
    } else {
      probe.trail.push({x:_tx,y:_ty});if(probe.trail.length>TRAIL_LEN)probe.trail.shift();
    }

    // Red giant heat
    if(p.type==='red'){
      orb.heat+=p.heatR*dt;
      if(orb.heat>=1){probe.vx=Math.cos(orb.ang)*rnd(4,7)+rnd(-2,2);probe.vy=Math.sin(orb.ang)*rnd(4,7)+rnd(-2,2);emitSpark(probe.x,probe.y,30,'#ff6600',4);Audio.blackholeStop();orb=null;phase='FLYING';}
    }

    // Black hole: grace period then slow pull
    if(p.type==='black'){
      if(orb.graceTime>0){
        orb.graceTime-=dt;
        if(orb.graceTime<0.7&&!orb.warned){orb.warned=true;flashAlpha=0.25;flashCol='#cc00ff';}
      } else {
        orb.omega*=Math.pow(1.003,dt);
        orb.r=Math.max(orb.r-0.18*dt,p.r+PROBE_R+2);
        if(orb.r<=p.r+PROBE_R+3.5)die('blackhole');
      }
    }

    if(!holding)release();
    const nkm=Math.max(0,Math.floor((startY-probe.y)/10));if(nkm>scoreKm){scoreKm=nkm;checkZone();}
  }

  for(const p of planets){p.rotA+=0.003*dt;p.pulse+=0.03*dt;for(const a of p.beltAsts)a.ang+=a.spd*dt;for(const mv of p.movers){mv.x+=mv.vx*dt;mv.y+=mv.vy*dt;if(mv.x<0||mv.x>W){mv.vx*=-1;mv.x=clamp(mv.x,0,W);}}}
  cam.x=lerp(cam.x,probe.x-W*0.5,0.06*dt);cam.y=lerp(cam.y,probe.y-H*0.65,0.06*dt);
  sparks=sparks.filter(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=Math.pow(0.9,dt);s.vy*=Math.pow(0.9,dt);s.life-=0.03*dt;return s.life>0;});

}

function sx(wx){return wx-cam.x+shakeX;}
function sy(wy){return wy-cam.y+shakeY;}

function lerpHex(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=Math.round(((pa>>16)&0xff)+t*(((pb>>16)&0xff)-((pa>>16)&0xff)));
  const g=Math.round(((pa>>8)&0xff)+t*(((pb>>8)&0xff)-((pa>>8)&0xff)));
  const bl=Math.round((pa&0xff)+t*((pb&0xff)-(pa&0xff)));
  return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${bl.toString(16).padStart(2,'0')}`;
}

// ── Draw planet — realistic gradients, glow, atmosphere ────────────────────
function drawPlanet(p,ppx,ppy,t){
  const r=p.r, sub=p.subtype||p.type;
  const rot=p.rotA, pulse=0.5+0.5*Math.sin(t*2+p.pulse);

  function RG(x0,y0,r0,x1,y1,r1,...s){
    const g=cx.createRadialGradient(x0,y0,Math.max(0,r0),x1,y1,Math.max(0.001,r1));
    for(let i=0;i<s.length;i+=2)g.addColorStop(s[i],s[i+1]);return g;
  }
  function LG(x0,y0,x1,y1,...s){
    const g=cx.createLinearGradient(x0,y0,x1,y1);
    for(let i=0;i<s.length;i+=2)g.addColorStop(s[i],s[i+1]);return g;
  }
  function disc(col){cx.fillStyle=col;cx.beginPath();cx.arc(ppx,ppy,r,0,Math.PI*2);cx.fill();}
  function clip(){cx.save();cx.beginPath();cx.arc(ppx,ppy,r,0,Math.PI*2);cx.clip();}
  function term(str=0.88){
    cx.fillStyle=RG(ppx+r*0.35,ppy,0,ppx+r*0.1,ppy,r*1.04,
      0,'transparent',0.45,'rgba(0,0,0,0.1)',0.75,`rgba(0,0,0,${str*0.8})`,1,`rgba(0,0,0,${str})`);
    disc('');cx.beginPath();cx.arc(ppx,ppy,r,0,Math.PI*2);cx.fill();
  }
  function spec(ix=-0.38,iy=-0.42,str=0.5){
    cx.fillStyle=RG(ppx+r*ix,ppy+r*iy,0,ppx+r*ix*0.5,ppy+r*iy*0.5,r*0.55,
      0,`rgba(255,255,255,${str})`,1,'transparent');
    cx.beginPath();cx.arc(ppx,ppy,r,0,Math.PI*2);cx.fill();
  }
  function atm(col,a=0.5){
    cx.strokeStyle=col;cx.lineWidth=r*0.06;cx.globalAlpha=a;
    cx.beginPath();cx.arc(ppx,ppy,r,0,Math.PI*2);cx.stroke();cx.globalAlpha=1;
  }

  cx.save();

  if(sub==='earth'){
    // Base sphere
    const bg=RG(ppx-r*0.3,ppy-r*0.3,r*0.05,ppx,ppy,r,0,'#4499ff',0.4,'#1155cc',1,'#002288');
    disc(bg);
    clip();
    // 3 continent blobs
    const ang=rot*0.08,ca=Math.cos(ang),sa=Math.sin(ang);
    [[-0.32,-0.28,'#3a9a3a'],[0.2,0.1,'#4a9a3a'],[0.35,-0.2,'#5aaa33']].forEach(([dx,dy,col])=>{
      const ox=ppx+(dx*ca-dy*sa)*r,oy=ppy+(dx*sa+dy*ca)*r;
      cx.fillStyle=col;cx.beginPath();cx.arc(ox,oy,r*0.32,0,Math.PI*2);cx.fill();
    });
    // North pole
    cx.fillStyle=RG(ppx,ppy-r*0.8,0,ppx,ppy-r*0.65,r*0.42,0,'rgba(240,250,255,0.9)',1,'transparent');
    cx.fillRect(ppx-r,ppy-r,r*2,r*0.55);
    // Cloud band
    cx.fillStyle='rgba(255,255,255,0.18)';
    cx.beginPath();cx.ellipse(ppx,ppy-r*0.2,r*0.7,r*0.1,rot*0.05,0,Math.PI*2);cx.fill();
    cx.restore();
    term(0.88);spec(-0.36,-0.4,0.48);atm('rgba(100,160,255,0.5)');

  }else if(sub==='mars'){
    disc(RG(ppx-r*0.25,ppy-r*0.25,r*0.05,ppx,ppy,r,0,'#e87744',0.35,'#cc5522',0.7,'#993311',1,'#661100'));
    clip();
    // Polar cap
    cx.fillStyle=RG(ppx,ppy-r*0.82,0,ppx,ppy-r*0.68,r*0.38,0,'rgba(240,248,255,0.85)',1,'transparent');
    cx.fillRect(ppx-r,ppy-r,r*2,r*0.5);
    // Canyon
    cx.save();cx.translate(ppx,ppy);cx.rotate(rot*0.08);
    cx.strokeStyle='rgba(80,20,5,0.5)';cx.lineWidth=r*0.055;cx.lineCap='round';
    cx.beginPath();cx.moveTo(-r*0.5,r*0.05);cx.bezierCurveTo(-r*0.1,r*0.02,r*0.15,r*0.08,r*0.45,r*0.02);cx.stroke();
    cx.restore();
    // Volcano
    cx.fillStyle=RG(ppx-r*0.28,ppy-r*0.1,0,ppx-r*0.28,ppy-r*0.1,r*0.16,0,'rgba(180,75,35,0.65)',1,'transparent');
    cx.beginPath();cx.arc(ppx-r*0.28,ppy-r*0.1,r*0.16,0,Math.PI*2);cx.fill();
    // Dust storm
    const dsx=ppx+Math.cos(t*0.2+rot)*r*0.2,dsy=ppy+r*0.1;
    cx.fillStyle=RG(dsx,dsy,0,dsx,dsy,r*0.25,0,'rgba(220,145,75,0.3)',1,'transparent');
    cx.beginPath();cx.ellipse(dsx,dsy,r*0.25,r*0.14,0.5,0,Math.PI*2);cx.fill();
    // 3 craters
    [[0.32,0.22,0.09],[0.18,-0.38,0.08],[-0.28,0.28,0.09]].forEach(([dx,dy,cr])=>{
      const ox=ppx+dx*r,oy=ppy+dy*r;
      cx.strokeStyle='rgba(200,110,70,0.45)';cx.lineWidth=r*cr*0.18;
      cx.beginPath();cx.arc(ox,oy,r*cr,0,Math.PI*2);cx.stroke();
      cx.fillStyle=RG(ox,oy,0,ox,oy,r*cr,0,'rgba(70,18,6,0.5)',1,'transparent');
      cx.beginPath();cx.arc(ox,oy,r*cr,0,Math.PI*2);cx.fill();
    });
    cx.restore();
    term(0.86);spec(-0.35,-0.38,0.38,'255,200,180');atm('rgba(255,140,80,0.4)');

  }else if(sub==='jupiter'){
    disc(RG(ppx-r*0.2,ppy-r*0.2,r*0.05,ppx,ppy,r,0,'#f0d090',0.4,'#c8903c',1,'#5a3515'));
    clip();
    // 5 bands
    [[-0.75,0.12,'#b87040'],[-0.48,0.14,'#d8b868'],[-0.18,0.1,'#b87840'],
     [0.1,0.14,'#d0a860'],[0.38,0.1,'#c08040']].forEach(([y,h,c])=>{
      cx.fillStyle=c;cx.fillRect(ppx-r,ppy+y*r,r*2,h*r);
    });
    // GRS
    const gx=ppx+Math.cos(rot*0.15)*r*0.22,gy=ppy+r*0.12;
    cx.fillStyle=RG(gx,gy,r*0.04,gx,gy,r*0.18,0,'rgba(190,65,28,0.8)',0.6,'rgba(155,45,18,0.5)',1,'transparent');
    cx.beginPath();cx.ellipse(gx,gy,r*0.18,r*0.11,0,0,Math.PI*2);cx.fill();
    cx.restore();
    // Limb dark
    cx.fillStyle=RG(ppx,ppx,r*0.4,ppx,ppy,r,0,'transparent',0.65,'rgba(20,10,0,0.12)',1,'rgba(10,5,0,0.55)');
    cx.beginPath();cx.arc(ppx,ppy,r,0,Math.PI*2);cx.fill();
    spec(-0.3,-0.34,0.38,'255,240,200');

  }else if(sub==='saturn'){
    // Back rings
    cx.save();cx.translate(ppx,ppy);
    cx.fillStyle=RG(0,0,r*1.18,0,0,r*2.08,0,'rgba(210,185,140,0.68)',0.45,'rgba(195,168,122,0.42)',0.7,'rgba(175,150,108,0.28)',1,'transparent');
    cx.beginPath();cx.ellipse(0,0,r*2.08,r*2.08*0.27,0,Math.PI,0);cx.fill();
    cx.restore();
    // Planet
    disc(RG(ppx-r*0.22,ppy-r*0.22,r*0.04,ppx,ppy,r,0,'#f2e095',0.28,'#dfc070',0.6,'#b88838',1,'#5a3c0a'));
    clip();
    [[-0.6,0.1,'rgba(220,190,115,0.22)'],[-0.35,0.12,'rgba(175,140,70,0.18)'],
     [0.0,0.16,'rgba(215,185,110,0.2)'],[0.28,0.1,'rgba(175,140,70,0.16)']].forEach(([y,h,c])=>{
      cx.fillStyle=c;cx.fillRect(ppx-r,ppy+y*r,r*2,h*r);
    });
    cx.restore();
    term(0.82);spec(-0.33,-0.37,0.4,'255,245,205');
    // Front rings
    cx.save();cx.translate(ppx,ppy);
    cx.fillStyle=RG(0,0,r*1.18,0,0,r*2.08,0,'rgba(210,185,140,0.65)',0.45,'rgba(195,168,122,0.4)',0.7,'rgba(175,150,108,0.25)',1,'transparent');
    cx.beginPath();cx.ellipse(0,0,r*2.08,r*2.08*0.27,0,0,Math.PI);cx.fill();
    // Cassini gap
    cx.strokeStyle='rgba(20,14,5,0.5)';cx.lineWidth=r*0.03;
    cx.beginPath();cx.ellipse(0,0,r*1.495,r*1.495*0.27,0,0,Math.PI);cx.stroke();
    cx.restore();
    // Belt asteroids
    for(const a of p.beltAsts){
      const ax=ppx+Math.cos(a.ang)*p.beltR,ay=ppy+Math.sin(a.ang)*p.beltR*0.27;
      cx.fillStyle='#aa9977';cx.beginPath();cx.arc(ax,ay,a.sz*0.4,0,Math.PI*2);cx.fill();
    }

  }else if(sub==='uranus'){
    disc(RG(ppx-r*0.28,ppy-r*0.28,r*0.04,ppx,ppy,r,0,'#aaeedd',0.32,'#55ccbb',0.68,'#229988',1,'#0d5548'));
    clip();
    cx.fillStyle='rgba(140,230,220,0.18)';cx.fillRect(ppx-r,ppy-r*0.5,r*2,r*0.2);
    cx.fillStyle='rgba(110,220,210,0.14)';cx.fillRect(ppx-r,ppy+r*0.1,r*2,r*0.18);
    cx.restore();
    term(0.8);spec(-0.37,-0.4,0.48,'200,255,250');
    cx.save();cx.translate(ppx,ppy);
    [r*1.38,r*1.55,r*1.72].forEach(rr2=>{
      cx.strokeStyle='rgba(160,220,215,0.12)';cx.lineWidth=1.2;
      cx.beginPath();cx.ellipse(0,0,rr2,rr2*0.11,0,0,Math.PI*2);cx.stroke();
    });
    cx.restore();
    atm('rgba(80,220,210,0.45)');

  }else if(sub==='neptune'){
    disc(RG(ppx-r*0.26,ppy-r*0.26,r*0.04,ppx,ppy,r,0,'#5588ff',0.32,'#2244dd',0.68,'#1133aa',1,'#051068'));
    clip();
    [{y:-0.4,h:0.11,c:'rgba(70,110,255,0.28)'},{y:0.1,h:0.13,c:'rgba(60,100,240,0.24)'}].forEach(b=>{
      cx.fillStyle=b.c;cx.fillRect(ppx-r,ppy+b.y*r,r*2,b.h*r);
    });
    // GDS
    const gx=ppx+Math.cos(rot*0.12)*r*0.2,gy=ppy-r*0.18;
    cx.fillStyle=RG(gx,gy,0,gx,gy,r*0.16,0,'rgba(8,18,80,0.85)',1,'transparent');
    cx.beginPath();cx.ellipse(gx,gy,r*0.16,r*0.09,0.2,0,Math.PI*2);cx.fill();
    // White storm
    const sx=ppx+Math.cos(rot*0.3+2)*r*0.3,sy=ppy+r*0.08;
    cx.fillStyle=RG(sx,sy,0,sx,sy,r*0.08,0,'rgba(160,185,255,0.7)',1,'transparent');
    cx.beginPath();cx.arc(sx,sy,r*0.08,0,Math.PI*2);cx.fill();
    cx.restore();
    term(0.86);spec(-0.37,-0.4,0.48,'160,190,255');
    cx.save();cx.translate(ppx,ppy);
    [r*1.4,r*1.55].forEach(rr2=>{
      cx.strokeStyle='rgba(80,100,200,0.15)';cx.lineWidth=1.2;
      cx.beginPath();cx.ellipse(0,0,rr2,rr2*0.18,0,0,Math.PI*2);cx.stroke();
    });
    cx.restore();
    atm('rgba(70,110,255,0.45)');

  }else if(sub==='mercury'){
    disc(RG(ppx-r*0.3,ppy-r*0.3,r*0.03,ppx,ppy,r,0,'#c8c0b4',0.38,'#a8a098',0.72,'#686050',1,'#282010'));
    clip();
    // Caloris basin
    cx.strokeStyle='rgba(160,140,120,0.45)';cx.lineWidth=r*0.045;
    cx.beginPath();cx.arc(ppx+r*0.15,ppy-r*0.1,r*0.32,0,Math.PI*2);cx.stroke();
    // 4 craters
    [[0.32,0.24,0.1],[0.18,-0.38,0.09],[-0.28,0.28,0.09],[0.38,-0.14,0.08]].forEach(([dx,dy,cr])=>{
      const ox=ppx+dx*r,oy=ppy+dy*r;
      cx.strokeStyle='rgba(195,178,158,0.5)';cx.lineWidth=r*cr*0.18;
      cx.beginPath();cx.arc(ox,oy,r*cr,0,Math.PI*2);cx.stroke();
      cx.fillStyle=RG(ox,oy,0,ox,oy,r*cr,0,'rgba(25,18,12,0.6)',1,'transparent');
      cx.beginPath();cx.arc(ox,oy,r*cr,0,Math.PI*2);cx.fill();
    });
    cx.restore();
    // Hard terminator
    cx.fillStyle=LG(ppx-r,ppy,ppx+r,ppy,0,'transparent',0.47,'transparent',0.54,'rgba(0,0,0,0.42)',0.72,'rgba(0,0,0,0.86)',1,'rgba(0,0,0,0.96)');
    cx.beginPath();cx.arc(ppx,ppy,r,0,Math.PI*2);cx.fill();
    spec(-0.34,-0.37,0.42,'228,218,205');

  }else if(sub==='venus'){
    cx.fillStyle=RG(ppx,ppy,r*0.88,ppx,ppy,r*1.55,0,'rgba(255,220,80,0.28)',0.5,'rgba(240,185,45,0.12)',1,'transparent');
    cx.beginPath();cx.arc(ppx,ppy,r*1.55,0,Math.PI*2);cx.fill();
    disc(RG(ppx-r*0.2,ppy-r*0.2,r*0.04,ppx,ppy,r,0,'#f8e8a0',0.28,'#eecf70',0.58,'#cca030',1,'#604808'));
    clip();
    [-0.65,-0.4,-0.1,0.2,0.5,0.75].forEach((y,i)=>{
      cx.save();cx.translate(ppx,ppy);cx.rotate(rot*0.04*(i%2?1:-1));
      cx.fillStyle=`rgba(255,240,160,${0.14+i*0.02})`;cx.fillRect(-r,y*r,r*2,r*0.14);
      cx.restore();
    });
    cx.restore();
    cx.fillStyle=RG(ppx+r*0.5,ppy,0,ppx+r*0.18,ppy,r*1.1,0,'transparent',0.38,'rgba(6,4,0,0.08)',0.72,'rgba(6,4,0,0.55)',1,'rgba(6,4,0,0.82)');
    cx.beginPath();cx.arc(ppx,ppy,r,0,Math.PI*2);cx.fill();
    spec(-0.37,-0.4,0.52,'255,248,220');atm('rgba(255,200,80,0.45)',0.5);

  }else if(sub==='moon'){
    disc(RG(ppx-r*0.3,ppy-r*0.3,r*0.03,ppx,ppy,r,0,'#d8d0c8',0.38,'#a8a098',0.72,'#706860',1,'#302820'));
    clip();
    // 3 maria
    [[0.15,-0.25,0.38,0.28],[0.32,0.1,0.24,0.18],[-0.1,0.18,0.2,0.14]].forEach(([dx,dy,rx,ry])=>{
      cx.fillStyle=RG(ppx+dx*r,ppy+dy*r,0,ppx+dx*r,ppy+dy*r,r*rx,0,'rgba(55,50,45,0.68)',1,'transparent');
      cx.beginPath();cx.ellipse(ppx+dx*r,ppy+dy*r,r*rx,r*ry,rot*0.04,0,Math.PI*2);cx.fill();
    });
    // Craters
    [[0.3,0.25,0.11],[0.18,-0.4,0.09],[-0.3,0.28,0.1],[0.38,-0.14,0.08]].forEach(([dx,dy,cr])=>{
      const ox=ppx+dx*r,oy=ppy+dy*r;
      cx.strokeStyle='rgba(200,192,182,0.5)';cx.lineWidth=r*cr*0.17;
      cx.beginPath();cx.arc(ox,oy,r*cr,0,Math.PI*2);cx.stroke();
      cx.fillStyle=RG(ox,oy,0,ox,oy,r*cr,0,'rgba(20,16,13,0.65)',1,'transparent');
      cx.beginPath();cx.arc(ox,oy,r*cr,0,Math.PI*2);cx.fill();
    });
    cx.restore();
    cx.fillStyle=LG(ppx-r,ppy,ppx+r,ppy,0,'transparent',0.47,'transparent',0.55,'rgba(0,0,0,0.28)',0.7,'rgba(0,0,0,0.62)',1,'rgba(0,0,0,0.8)');
    cx.beginPath();cx.arc(ppx,ppy,r,0,Math.PI*2);cx.fill();
    spec(-0.32,-0.35,0.36,'240,232,222');

  }else if(p.type==='red'){
    const flick=0.55+0.45*Math.sin(t*3.2+p.pulse);
    // Corona
    cx.fillStyle=RG(ppx,ppy,r*0.88,ppx,ppy,r*2.5,0,`rgba(255,200,50,${0.32*flick})`,0.4,`rgba(255,120,0,${0.14*flick})`,1,'transparent');
    cx.beginPath();cx.arc(ppx,ppy,r*2.5,0,Math.PI*2);cx.fill();
    // 3 flares
    for(let f=0;f<3;f++){
      const fa=rot*0.4+f*Math.PI*2/3+Math.sin(t*0.9+f*1.8)*0.4;
      const fl=Math.max(r*0.05,r*(0.45+0.45*Math.sin(t*2+f*1.8+p.pulse)));
      const fx=ppx+Math.cos(fa)*(r+fl*0.15),fy=ppy+Math.sin(fa)*(r+fl*0.15);
      cx.fillStyle=RG(fx,fy,0,fx,fy,fl,0,`rgba(255,220,60,${0.55*flick})`,0.4,`rgba(255,100,0,${0.25*flick})`,1,'transparent');
      cx.beginPath();cx.arc(fx,fy,fl,0,Math.PI*2);cx.fill();
    }
    // Sphere
    disc(RG(ppx-r*0.28,ppy-r*0.28,r*0.04,ppx+r*0.1,ppy+r*0.1,r,0,'#fffaaa',0.15,'#ffdd00',0.38,'#ffaa00',0.65,'#ee5500',0.88,'#bb2200',1,'#660800'));
    clip();
    // 2 sunspots
    [{dx:0.3,dy:0.12,sr:0.1},{dx:-0.25,dy:-0.18,sr:0.08}].forEach(s=>{
      const sx=ppx+Math.cos(rot*0.3)*s.dx*r-Math.sin(rot*0.3)*s.dy*r;
      const sy=ppy+Math.sin(rot*0.3)*s.dx*r+Math.cos(rot*0.3)*s.dy*r;
      cx.fillStyle=RG(sx,sy,0,sx,sy,r*s.sr*1.5,0,'rgba(30,4,0,0.8)',0.6,'rgba(60,10,0,0.5)',1,'transparent');
      cx.beginPath();cx.arc(sx,sy,r*s.sr*1.5,0,Math.PI*2);cx.fill();
    });
    cx.restore();
    cx.fillStyle=RG(ppx,ppy,r*0.88,ppx,ppy,r*1.1,0,`rgba(255,180,0,${0.45+0.25*flick})`,1,'transparent');
    cx.beginPath();cx.arc(ppx,ppy,r*1.1,0,Math.PI*2);cx.fill();
    spec(-0.28,-0.33,0.55,'255,255,200');

  }else if(p.type==='black'){
    // Back disk
    cx.save();cx.translate(ppx,ppy);
    const dk=RG(0,0,r*1.08,0,0,r*2.2,0,'rgba(255,150,0,0.75)',0.35,'rgba(255,70,0,0.5)',0.7,'rgba(150,15,0,0.28)',1,'transparent');
    cx.fillStyle=dk;cx.beginPath();cx.ellipse(0,0,r*2.2,r*2.2*0.24,rot*0.2,Math.PI,0);cx.fill();
    cx.restore();
    // Lens rings
    for(let i=0;i<2;i++){
      cx.strokeStyle=`rgba(${255-i*40},${180-i*60},${80-i*20},${(0.32-i*0.08)*(0.7+0.3*pulse)})`;
      cx.lineWidth=r*0.035*(1-i*0.3);
      cx.beginPath();cx.arc(ppx,ppy,r*(1.02+i*0.04),0,Math.PI*2);cx.stroke();
    }
    // Event horizon
    disc(RG(ppx-r*0.1,ppy-r*0.1,0,ppx,ppy,r,0,'#0e0018',0.6,'#040008',1,'#000000'));
    // Front disk
    cx.save();cx.translate(ppx,ppy);
    cx.fillStyle=dk;cx.beginPath();cx.ellipse(0,0,r*2.2,r*2.2*0.24,rot*0.2,0,Math.PI);cx.fill();
    cx.restore();
    // Photon sphere
    cx.strokeStyle=`rgba(180,60,255,${0.6+0.25*pulse})`;cx.lineWidth=r*0.04;
    cx.beginPath();cx.arc(ppx,ppy,r*1.02,0,Math.PI*2);cx.stroke();
    // Gravity range
    if(p.gravR>0){cx.strokeStyle='rgba(100,0,180,0.07)';cx.lineWidth=1;cx.setLineDash([5,10]);
      cx.beginPath();cx.arc(ppx,ppy,p.gravR,0,Math.PI*2);cx.stroke();cx.setLineDash([]);}
  }

  cx.restore();
  // Moving asteroids
  for(const mv of p.movers){
    const mx=sx(mv.x),my=sy(mv.y),sz2=mv.sz;
    cx.save();cx.translate(mx,my);cx.rotate(mv.x*0.1);
    cx.fillStyle=RG(-sz2*0.3,-sz2*0.3,0,0,0,sz2*1.2,0,'#ccbb99',0.5,'#776655',1,'#221100');
    cx.beginPath();cx.moveTo(sz2,sz2*0.2);cx.lineTo(sz2*0.3,sz2*0.9);cx.lineTo(-sz2*0.7,sz2*0.6);cx.lineTo(-sz2*0.9,-sz2*0.1);cx.lineTo(-sz2*0.4,-sz2*0.8);cx.lineTo(sz2*0.6,-sz2*0.5);cx.closePath();cx.fill();
    cx.restore();
  }
}

function drawShip(ctx,x,y,ang,shipId,col,S=16){
  const T=Date.now()*0.001;
  const P=Math.sin(T*6)*0.5+0.5;   // fast pulse (engine)
  const P2=Math.sin(T*3.5+1)*0.5+0.5; // slow pulse (glow)
  const P3=Math.sin(T*9+0.5)*0.5+0.5; // flicker

  // helpers
  function G(x0,y0,x1,y1,...stops){
    const g=ctx.createLinearGradient(x0,y0,x1,y1);
    for(let i=0;i<stops.length;i+=2)g.addColorStop(stops[i],stops[i+1]);
    return g;
  }
  function RG(x0,y0,r0,x1,y1,r1,...stops){
    const r0s=Math.max(0,r0),r1s=Math.max(0.001,r1);
    const g=ctx.createRadialGradient(x0,y0,r0s,x1,y1,r1s);
    for(let i=0;i<stops.length;i+=2)g.addColorStop(stops[i],stops[i+1]);
    return g;
  }
  function poly(...pts){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();}
  // Multi-layer flame
  function flame(x0,y0,dx,dy,w,len,c1,c2,pulse){
    const fl=len*(0.6+pulse*0.4);
    const perp=Math.atan2(dy,dx)+Math.PI/2;
    const px=Math.cos(perp),py=Math.sin(perp);
    // outer glow
    ctx.fillStyle=G(x0,y0,x0+dx*fl,y0+dy*fl,0,c1+'44',0.6,c2+'22',1,'transparent');
    poly(x0+px*w*1.4,y0+py*w*1.4,x0+dx*fl*1.1,y0+dy*fl*1.1,x0-px*w*1.4,y0-py*w*1.4);ctx.fill();
    // core flame
    ctx.fillStyle=G(x0,y0,x0+dx*fl*0.9,y0+dy*fl*0.9,0,'#ffffff',0.15,c1,0.55,c2+'aa',1,'transparent');
    poly(x0+px*w,y0+py*w,x0+dx*fl*0.9,y0+dy*fl*0.9,x0-px*w,y0-py*w);ctx.fill();
    // hot core
    ctx.fillStyle=G(x0,y0,x0+dx*fl*0.3,y0+dy*fl*0.3,0,'#ffffff',1,'#ffffff00');
    poly(x0+px*w*0.3,y0+py*w*0.3,x0+dx*fl*0.3,y0+dy*fl*0.3,x0-px*w*0.3,y0-py*w*0.3);ctx.fill();
  }
  // Engine nozzle bell
  function nozzle(cx2,cy2,rOuter,rInner,len,flameCol,pulse){
    // Bell shape
    const bg=G(cx2-rOuter,cy2,cx2+rOuter,cy2,0,'#3a4455',0.5,'#5a6677',1,'#3a4455');
    ctx.fillStyle=bg;
    ctx.beginPath();ctx.arc(cx2,cy2,rOuter,0,Math.PI*2);ctx.fill();
    // Cooling rings
    for(let r2=0;r2<3;r2++){
      const ry=rOuter*(0.35+r2*0.22);
      ctx.strokeStyle='#2a3344';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(cx2,cy2,ry,0,Math.PI*2);ctx.stroke();
    }
    // Inner throat glow
    ctx.fillStyle=RG(cx2,cy2,0,cx2,cy2,rInner,0,flameCol+'ff',0.4,flameCol+'88',1,'#00000000');
    ctx.beginPath();ctx.arc(cx2,cy2,rInner,0,Math.PI*2);ctx.fill();
    // Hot core
    const core=Math.max(0.001,rInner*0.4*(0.6+pulse*0.4));
    ctx.fillStyle=RG(cx2,cy2,0,cx2,cy2,core,0,'#ffffff',0.5,flameCol,1,'transparent');
    ctx.beginPath();ctx.arc(cx2,cy2,core,0,Math.PI*2);ctx.fill();
    // Exhaust streak inside bell
    ctx.fillStyle=G(cx2,cy2,cx2+len,cy2,0,flameCol+'cc',0.3,'#ffffff55',0.7,flameCol+'44',1,'transparent');
    ctx.fillRect(cx2,cy2-rInner*0.5,len,rInner);
  }
  // Panel rivets
  function rivets(pts,r2=1.2,col='#778899'){
    ctx.fillStyle=col;
    for(let i=0;i<pts.length;i+=2){ctx.beginPath();ctx.arc(pts[i],pts[i+1],r2,0,Math.PI*2);ctx.fill();}
  }
  // Cockpit glass multi-layer
  function cockpit(cx2,cy2,rw,rh,ang2=0,tint='#2266aa'){
    // Frame
    ctx.fillStyle=G(-rw,-rh,rw,rh,0,'#445566',1,'#223344');
    ctx.beginPath();ctx.ellipse(cx2,cy2,rw+2,rh+2,ang2,0,Math.PI*2);ctx.fill();
    // Dark interior
    ctx.fillStyle=tint+'dd';
    ctx.beginPath();ctx.ellipse(cx2,cy2,rw,rh,ang2,0,Math.PI*2);ctx.fill();
    // HUD glow
    ctx.fillStyle=`rgba(0,200,255,${0.08+0.06*P2})`;
    ctx.beginPath();ctx.ellipse(cx2,cy2,rw*0.7,rh*0.7,ang2,0,Math.PI*2);ctx.fill();
    // Glass highlight
    ctx.fillStyle=RG(cx2-rw*0.3,cy2-rh*0.5,0,cx2-rw*0.2,cy2-rh*0.2,rw*0.55,
      0,'rgba(255,255,255,0.55)',0.4,'rgba(200,240,255,0.18)',1,'transparent');
    ctx.beginPath();ctx.ellipse(cx2,cy2,rw,rh,ang2,0,Math.PI*2);ctx.fill();
    // Outer reflection line
    ctx.strokeStyle='rgba(200,240,255,0.4)';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.ellipse(cx2,cy2,rw,rh,ang2,0,Math.PI*2);ctx.stroke();
  }
  // Hull panel line
  function panel(x0,y0,x1,y1,col='rgba(80,100,120,0.45)'){
    ctx.strokeStyle=col;ctx.lineWidth=0.7;
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  }
  // Pipe along a line
  function pipe(x0,y0,x1,y1,r2=2,col='#445566'){
    const ang2=Math.atan2(y1-y0,x1-x0);const len=Math.hypot(x1-x0,y1-y0);
    ctx.save();ctx.translate(x0,y0);ctx.rotate(ang2);
    const pg=G(0,-r2,0,r2,0,col+'ff',0.4,'#aabbcc88',0.5,'#ffffff44',1,col+'ff');
    ctx.fillStyle=pg;ctx.fillRect(0,-r2,len,r2*2);
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.5;
    ctx.strokeRect(0,-r2,len,r2*2);
    ctx.restore();
  }
  // Heat tile pattern (shuttle-style)
  function heatTiles(x,y,w,h,rows,cols,baseCol){
    const tw=w/cols,th=h/rows;
    for(let r2=0;r2<rows;r2++)for(let c=0;c<cols;c++){
      const v=0.75+Math.sin(r2*1.7+c*2.3)*0.25;
      ctx.fillStyle=baseCol;ctx.globalAlpha=v*0.5;
      ctx.fillRect(x+c*tw+0.5,y+r2*th+0.5,tw-1,th-1);
      ctx.globalAlpha=1;
    }
  }

  ctx.save();
  ctx.translate(Math.round(x),Math.round(y));
  ctx.rotate(ang);
  ctx.imageSmoothingEnabled=true;

  const sc=S/7.5; // universal scale factor

  // ═══════════════════════════════════════════════════════════════════════════
  // KEŞİF SONDASI (arrow)
  // ═══════════════════════════════════════════════════════════════════════════
  if(shipId==='arrow'){
    const s=sc;

    // Engine flame (multi-layer)
    flame(-s*6,0,-1,0,s*2.2,s*22,'#44ccff','#0044ff',P);
    flame(-s*6,0,-1,0,s*1.0,s*16,'#88eeff','#0088ff',P3);

    // Main fuselage — tapered cylinder
    ctx.fillStyle=G(0,-s*4,0,s*4,
      0,'#ccd8e8',0.3,'#e8f0f8',0.7,'#9aacbc',1,'#667788');

      ctx.strokeStyle=`rgba(255,${Math.floor(60+P*80)},0,${0.5+0.2*P})`;ctx.lineWidth=1.5;
      ctx.shadowColor='#ff4400';ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(-s*10,sv*s*4,s*2.6,0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
      nozzle(-s*10,sv*s*4,s*2.4,s*1.5,s*5,'#ff3300',sv>0?P:P2);
      // Extra inner glow
      ctx.fillStyle=RG(-s*10,sv*s*4,0,-s*10,sv*s*4,s*1.2,
        0,`rgba(255,180,50,${0.6+0.3*P3})`,0.5,'rgba(255,60,0,0.4)',1,'transparent');
      ctx.beginPath();ctx.arc(-s*10,sv*s*4,s*1.2,0,Math.PI*2);ctx.fill();
    }

    // ── Volcanic eruption particle halo (drifting embers) ─────────────────
    for(let i=0;i<8;i++){
      const ep=(T*0.8+i*0.18)%1;
      const ea=i*Math.PI*2/8+T*0.3;
      const er=s*(5+ep*8);
      const ex=Math.cos(ea)*er,ey=Math.sin(ea)*er*0.5;
      const eal=Math.sin(ep*Math.PI)*0.6;
      ctx.fillStyle=`rgba(255,${Math.floor(60+ep*100)},0,${eal*0.5})`;
      ctx.beginPath();ctx.arc(ex,ey,s*(0.8-ep*0.5),0,Math.PI*2);ctx.fill();
    }
  }

  ctx.restore();
}
const GAME_ZOOM=0.9; // 10% zoom out — see more of the world

function draw(ts){
  cx.clearRect(0,0,W,H);uiZones=[];
  const t=ts*0.001;
  if(phase==='SHOP'||phase==='LEADERBOARD'){if(phase==='SHOP')drawShop(t,ts);else drawLeaderboard(t);return;}

  const z=getZone(scoreKm);

  // ── Background (full screen, pure black space) ────────────────────────────
  cx.fillStyle='#000005';cx.fillRect(0,0,W,H);
  // Zone color tint (subtle)
  const zoneTint=cx.createLinearGradient(0,0,0,H*0.5);
  zoneTint.addColorStop(0,bgCol+'44');zoneTint.addColorStop(1,'transparent');
  cx.fillStyle=zoneTint;cx.fillRect(0,0,W,H);


  // ── Stars & Constellations ────────────────────────────────────────────────
  const camPX=cam.x||0, camPY=cam.y||0;

  for(const s of STARS){
    // Simple: fixed screen position shifted slightly by camera (parallax)
    let px = (s.nx * W - camPX * s.spd * 0.05 % W + W*2) % W;
    let py = (s.ny * H - camPY * s.spd * 0.05 % H + H*2) % H;
    const twk = s.alpha * (0.7 + 0.3 * Math.sin(t * 0.4 + s.twk));
    cx.globalAlpha = twk;
    cx.fillStyle = s.col;
    if(s.bright){
      cx.beginPath(); cx.arc(px, py, s.sz, 0, Math.PI*2); cx.fill();
      cx.globalAlpha = twk * 0.25;
      cx.fillRect(px - s.sz*3, py - 0.3, s.sz*6, 0.6);
      cx.fillRect(px - 0.3, py - s.sz*3, 0.6, s.sz*6);
    } else if(s.medium){
      cx.beginPath(); cx.arc(px, py, s.sz, 0, Math.PI*2); cx.fill();
    } else {
      cx.fillRect(px, py, s.sz, s.sz);
    }
  }
  cx.globalAlpha = 1;

  for(const con of CONSTS){
    const ox = (con.ax * W - camPX * con.spd * 0.03 % W + W*2) % W;
    const oy = (con.ay * H - camPY * con.spd * 0.03 % H + H*2) % H;
    const c2 = Math.cos(con.rot), s2 = Math.sin(con.rot), sc = con.sc;
    const pts = con.pts.map(([x,y]) => {
      const rx=x*sc, ry=y*sc;
      return [ox + rx*c2 - ry*s2, oy + rx*s2 + ry*c2];
    });
    cx.strokeStyle = 'rgba(140,170,230,0.18)'; cx.lineWidth = 0.8;
    for(let i=0; i<pts.length-1; i++){
      const [x0,y0]=pts[i], [x1,y1]=pts[i+1];
      if(Math.abs(x1-x0)>W*0.5 || Math.abs(y1-y0)>H*0.5) continue;
      cx.beginPath(); cx.moveTo(x0,y0); cx.lineTo(x1,y1); cx.stroke();
    }
    for(let i=0; i<pts.length; i++){
      const [x,y] = pts[i];
      if(x<-20||x>W+20||y<-20||y>H+20) continue;
      cx.fillStyle = '#c0d4f0';
      cx.globalAlpha = i===0 ? 0.6 : 0.38;
      cx.beginPath(); cx.arc(x, y, i===0?1.5:1.0, 0, Math.PI*2); cx.fill();
    }
  }
  cx.globalAlpha = 1;

  // ── If paused — skip game world, just show pause screen ──────────────────
  if(paused){
    drawPause(t);
    cx.restore();
    return;
  }

  // ── Game world (zoomed out 10%) — only during gameplay ───────────────────
  const isPlaying=phase==='FLYING'||phase==='ORBITING';
  if(isPlaying){
  cx.save();
  cx.translate(W/2,H/2);cx.scale(GAME_ZOOM,GAME_ZOOM);cx.translate(-W/2,-H/2);

  if(holding&&phase==='FLYING'){
    for(const p of planets){
      const dd=d2(probe.x,probe.y,p.x,p.y);
      if(dd<ROPE_LEN&&dd>p.r+PROBE_R*2){
        const ppx=sx(p.x),ppy=sy(p.y);
        cx.globalAlpha=(1-dd/ROPE_LEN)*0.5;
        const hintCol=p.type==='red'?'#ffaa00':p.type==='black'?'#aa44ff':
          p.subtype==='earth'?'#44aaff':p.subtype==='mars'?'#ff6633':
          p.subtype==='jupiter'?'#ddaa55':p.subtype==='saturn'?'#ddcc88':
          p.subtype==='uranus'?'#44ddcc':p.subtype==='venus'?'#ffdd44':
          p.subtype==='mercury'?'#aabb99':p.subtype==='neptune'?'#4466ff':p.subtype==='moon'?'#ccccbb':'#aaddff';
        cx.strokeStyle=hintCol;cx.lineWidth=1;cx.setLineDash([3,5]);
        cx.beginPath();cx.arc(ppx,ppy,p.r+16,0,Math.PI*2);cx.stroke();
        cx.setLineDash([]);cx.globalAlpha=1;
      }
    }
  }

  // Planets
  for(const p of planets){
    const ppx=sx(p.x),ppy=sy(p.y);
    if(ppx<-p.r*6||ppx>W+p.r*6)continue;
    try{drawPlanet(p,ppx,ppy,t);}
    catch(e){console.error('drawPlanet error:',p.subtype||p.type,e.message);}
  }

  // Trail (pixel squares, color per trail)
  const _tc=trailCol(t);
  function drawTrailArr(arr){
    if(arr.length<2)return;
    // Draw as a single path per alpha band for perf
    const len=arr.length;
    for(let i=1;i<len;i++){
      const ratio=i/len;
      cx.globalAlpha=ratio*0.7;
      cx.fillStyle=_tc;
      const px2=pxr(sx(arr[i].x)),py2=pxr(sy(arr[i].y));
      cx.fillRect(px2,py2,2,2);
    }
    cx.globalAlpha=1;
  }
  drawTrailArr(probe.trail);
  if(probe.trail2.length>0)drawTrailArr(probe.trail2);
  if(probe.trail3.length>0)drawTrailArr(probe.trail3);
  if(probe.trail4.length>0)drawTrailArr(probe.trail4);

  // Rope/tether (dashed pixel beam)
  if(orb){
    const rx0=pxr(sx(probe.x)),ry0=pxr(sy(probe.y));
    const rx1=pxr(sx(orb.planet.x)),ry1=pxr(sy(orb.planet.y));
    const hcol=orb.heat>0?`hsl(${(1-orb.heat)*110},100%,58%)`:trailCol(t);
    cx.strokeStyle=hcol;cx.lineWidth=2;cx.globalAlpha=0.9;cx.setLineDash([4,3]);
    cx.beginPath();cx.moveTo(rx0,ry0);cx.lineTo(rx1,ry1);cx.stroke();
    cx.setLineDash([]);cx.globalAlpha=1;
    cx.fillStyle='#ffffff';cx.fillRect(rx0-1,ry0-1,2,2);// joint pixel
  }

  // Sparks
  for(const s of sparks){
    cx.fillStyle=s.col;cx.globalAlpha=s.life;
    cx.fillRect(pxr(sx(s.x)),pxr(sy(s.y)),s.sz,s.sz);
    cx.globalAlpha=1;
  }

  // Ship
  if(phase!=='MENU'){
    const tc=trailCol(t);
    const _shipS=(selShipDef().S)||2.5;
    drawShip(cx,sx(probe.x),sy(probe.y),probe.ang,selShip,tc,_shipS);
    // Orbit indicators (spin bar, heat, black hole grace)
    if(phase==="ORBITING"&&orb){
      const ppx=Math.round(sx(probe.x)),ppy=Math.round(sy(probe.y));
      const bw2=64,bh2=8,bx2=ppx-bw2/2,bby=ppy-46;
      if(orb.planet.type==="red"&&orb.heat>0){
        const hcol=`hsl(${(1-orb.heat)*100},100%,55%)`;
        progressBar(bx2,bby,bw2,bh2,orb.heat,hcol,'rgba(60,0,0,0.7)');
        glowText('GÜNEŞ SICAKLIĞI',ppx,bby-4,hcol,8,6);
      }
      if(orb.planet.type!=="black"&&(orb.spinMult||1)>1.05){
        const prog=Math.min(1,((orb.spinMult||1)-1)/(MAX_SPIN_MULT-1));
        const barCol=`hsl(${(1-prog)*120},100%,55%)`;
        progressBar(bx2,bby,bw2,bh2,prog,barCol,'rgba(0,10,30,0.7)');
        glowText(`×${(orb.spinMult||1).toFixed(1)} HIZ`,ppx,bby-4,barCol,8,6);
      }
      if(orb.planet.type==="black"){
        if((orb.graceTime||0)>0){
          const gp2=(orb.graceTime||0)/1.8;
          const gc=gp2>0.4?"#cc44ff":"#ff2244";
          progressBar(bx2,bby,bw2,bh2,gp2,gc,'rgba(20,0,40,0.7)');
          glowText('HEMEN KAÇ!',ppx,bby-4,gc,8,8);
        } else {
          const pulse3=0.65+0.35*Math.sin(t*10);
          glowText('ÇEKİLİYORSUN!',ppx,bby,`rgba(255,40,40,${pulse3})`,9,12);
        }
      }
    }
  }

  cx.restore(); // end game world zoom
  } // end isPlaying

  drawHUD(t,z);

  if(flashAlpha>0){cx.globalAlpha=flashAlpha*0.65;cx.fillStyle=flashCol;cx.fillRect(0,0,W,H);cx.globalAlpha=1;}
  if(announce.on&&announce.zone)drawAnnounce();
  if(phase==='MENU')drawMenu(t,ts);
  if(phase==='DEAD')drawDead(t);
}

// Rounded rect path (safe)
function rr(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  if(r<=0){cx.beginPath();cx.rect(x,y,w,h);return;}
  cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r);cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h);cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r);cx.arcTo(x,y,x+r,y,r);cx.closePath();
}
// Safe alpha variant of any color string
function colA(col,a){
  try{
    if(col.startsWith('#')&&col.length===7){
      const n=parseInt(col.slice(1),16);
      return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
    }
    if(col.startsWith('rgba')){return col.replace(/,\s*[\d.]+\s*\)/,`,${a})`);}
    if(col.startsWith('rgb(')){return col.replace('rgb(','rgba(').replace(')',`,${a})`);}
    if(col.startsWith('hsl(')){return col.replace('hsl(','hsla(').replace(')',`,${a})`);}
    if(col.startsWith('hsla')){return col.replace(/,\s*[\d.]+\s*\)/,`,${a})`);}
  }catch(e){}
  return col;
}

// Glass panel
function glassPanel(x,y,w,h,r=16,accentCol='rgba(80,160,255,0.35)',alpha=0.88){
  cx.save();
  // Backdrop fill
  rr(x,y,w,h,r);

  bg.addColorStop(0,`rgba(14,10,28,${alpha})`);
  bg.addColorStop(1,`rgba(6,4,16,${alpha*1.05})`);
  cx.fillStyle=bg;cx.fill();
  // Inner top highlight
  rr(x+1,y+1,w-2,h*0.4,r);
  cx.fillStyle='rgba(255,255,255,0.04)';cx.fill();
  // Border glow
  
  cx.strokeStyle=accentCol;cx.lineWidth=1.2;

  // Inner border shimmer
  cx.strokeStyle='rgba(255,255,255,0.07)';cx.lineWidth=1;

}

// Premium button with glow
function glowBtn(x,y,w,h,col,label,fs,icon=''){
  const r=Math.min(h*0.38,w/2);

// Slim progress bar
function progressBar(x,y,w,h,prog,col,bg='rgba(255,255,255,0.08)',r=4){
  rr(x,y,w,h,r);cx.fillStyle=bg;cx.fill();
  if(prog>0.01){
    const fw=Math.max(r*2,(w-2)*prog);
    rr(x+1,y+1,fw,h-2,Math.max(0,r-1));
    const g=cx.createLinearGradient(x,0,x+fw,0);
    g.addColorStop(0,colA(col,0.75));g.addColorStop(1,col);
    cx.fillStyle=g;cx.fill();
    rr(x+1,y+1,fw,Math.floor((h-2)*0.45),Math.max(0,r-1));
    cx.fillStyle='rgba(255,255,255,0.25)';cx.fill();
  }
  cx.strokeStyle='rgba(255,255,255,0.1)';cx.lineWidth=1;
  rr(x,y,w,h,r);cx.stroke();
}

function drawShop(t,ts){
  cx.save();
  // Rich background
  const sbg=cx.createRadialGradient(W/2,0,0,W/2,H,H);
  sbg.addColorStop(0,'#0e0a1e');sbg.addColorStop(1,'#050310');
  cx.fillStyle=sbg;cx.fillRect(0,0,W,H);

  // Header glass bar
  glassPanel(0,0,W,66,0,'rgba(80,120,255,0.35)',0.92);
  cx.strokeStyle='rgba(80,140,255,0.3)';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(0,66);cx.lineTo(W,66);cx.stroke();

  // Back button
  glowBtn(10,14,82,38,'#4488ff',T_.back,11,'←');
  regUI('shop_back',10,14,82,38);

  // Coins center
  glassPanel(W/2-70,10,140,46,12,'rgba(255,170,0,0.35)');
  coinBadge(W/2-18,33,coins,13);

  // Title
  const tbh=34,tby=70;
  glassPanel(10,tby,W-20,tbh,10,'rgba(80,120,255,0.25)');
  glowText('✦  UZAY ARAÇLARI  ✦',W/2,tby+tbh*0.72,'#aaccff',11,10);

  // Ship grid
  const cols=2,gapX=8,gapY=8;
  const gridX=10,gridY=tby+tbh+8;
  const cardW=Math.floor((W-gridX*2-gapX)/cols);
  const cardH=168;

  SHIPS.forEach((item,i)=>{
    const col2=i%cols,row=Math.floor(i/cols);
    const cxp=gridX+col2*(cardW+gapX),cyp=gridY+row*(cardH+gapY)-shopScroll;
    if(cyp+cardH<gridY-10||cyp>H+10)return;

    const owned=ownedShips.includes(item.id);
    const selected=selShip===item.id;
    const afford=!owned&&coins>=item.price;
    const isPremium=!!item.premium;

    // Card accent color
    const accent=selected?'rgba(80,220,100,0.6)':isPremium?'rgba(255,160,0,0.5)':owned?'rgba(255,170,0,0.3)':'rgba(80,100,200,0.2)';
    glassPanel(cxp,cyp,cardW,cardH,14,accent);

    // Premium card golden shimmer overlay
    if(isPremium&&!owned){
      rr(cxp,cyp,cardW,cardH,14);
      const shimmer=cx.createLinearGradient(cxp,cyp,cxp+cardW,cyp+cardH);
      shimmer.addColorStop(0,'rgba(255,180,0,0.06)');
      shimmer.addColorStop(0.5,'rgba(255,220,80,0.12)');
      shimmer.addColorStop(1,'rgba(255,150,0,0.06)');
      cx.fillStyle=shimmer;cx.fill();
    }
    if(selected){
      rr(cxp,cyp,cardW,cardH,14);
      cx.fillStyle='rgba(50,200,80,0.06)';cx.fill();
    }

    // Ship preview — clip to card area, scale down large ships
    const _sS=Math.min((SHIPS.find(s=>s.id===item.id)?.shopS)||13.33, cardW*0.32);
    const tc2=selected?trailCol(t):isPremium&&!owned?'rgba(255,160,0,0.5)':'rgba(80,120,200,0.7)';
    cx.save();
    cx.beginPath();cx.rect(cxp+4,cyp+4,cardW-8,cardH-8);cx.clip();
    if(isPremium&&!owned)cx.globalAlpha=0.55;
    drawShip(cx,cxp+cardW/2,cyp+58,t*0.45+i*0.8,item.id,tc2,_sS);
    cx.restore();

    // Lock icon overlay for premium
    if(isPremium&&!owned){
      cx.font='22px Arial';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillStyle='rgba(255,200,80,0.9)';
      cx.fillText('🔒',cxp+cardW/2,cyp+60);
      cx.textBaseline='alphabetic';
    }

    // Crown badge top-right for premium
    if(isPremium){
      const badgeX=cxp+cardW-22,badgeY=cyp+6;
      rr(badgeX,badgeY,18,18,5);
      const bg=cx.createLinearGradient(badgeX,badgeY,badgeX+18,badgeY+18);
      bg.addColorStop(0,'#ffcc00');bg.addColorStop(1,'#ff8800');
      cx.fillStyle=bg;cx.fill();
      cx.font='11px Arial';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillStyle='#3a1a00';cx.fillText('👑',badgeX+9,badgeY+9);
      cx.textBaseline='alphabetic';
    }

    // Name
    const nameCol=selected?'#88ffaa':isPremium?'#ffcc44':owned?'#ffe080':'rgba(180,200,255,0.85)';
    glowText(shipName(item.id),cxp+cardW/2,cyp+100,nameCol,10,selected?8:0);

    // Button
    const btnW=cardW-16,btnH=32,btnX=cxp+8,btnY=cyp+cardH-40;
    if(selected){
      glowBtn(btnX,btnY,btnW,btnH,'#33dd77',T_.selected,10,'✓');
    } else if(owned&&!isPremium||owned&&isPremium){
      glowBtn(btnX,btnY,btnW,btnH,'#4488ff',T_.select,11);
      regUI('buy_ship_'+item.id,btnX,btnY,btnW,btnH);
    } else if(isPremium){
      // Premium purchase button — gold
      glowBtn(btnX,btnY,btnW,btnH,'#ffaa00',item.premiumPrice||'₺49,99',10,'👑');
      regUI('premium_ship_'+item.id,btnX,btnY,btnW,btnH);
    } else if(item.price===0){
      glowBtn(btnX,btnY,btnW,btnH,'#33dd77',T_.free,10,'★');
      regUI('buy_ship_'+item.id,btnX,btnY,btnW,btnH);
    } else if(afford){
      glowBtn(btnX,btnY,btnW,btnH,'#ffaa22',item.price.toLocaleString(),10,'★');
      regUI('buy_ship_'+item.id,btnX,btnY,btnW,btnH);
    } else {
      glowBtn(btnX,btnY,btnW,btnH,'rgba(80,80,100,0.5)',item.price.toLocaleString(),10,'★');
    }
  });
  cx.restore();
}

    cx.fillStyle=isTop3?rankCol:'rgba(150,160,190,0.8)';

    cx.shadowBlur=0;

    // Score
    const scFs=Math.min(12,rowH*0.38);
    cx.font=`900 ${scFs}px ${FONT}`;cx.textAlign='right';
    cx.fillStyle=isTop3?GOLD:'rgba(220,230,255,0.9)';
    cx.fillText(e.score.toLocaleString(),COLS.score,ry+rowH*0.47);

    // KM
    cx.font=`bold 8px ${FONT}`;cx.fillStyle='rgba(120,160,200,0.6)';
    cx.fillText(`${e.km}km`,COLS.km,ry+rowH*0.47);
    cx.textBaseline='alphabetic';

    // Row separator
    if(i<19){cx.strokeStyle='rgba(255,255,255,0.05)';cx.lineWidth=1;cx.beginPath();cx.moveTo(8,ry+rowH-1);cx.lineTo(W-8,ry+rowH-1);cx.stroke();}
  });

  if(leaderboard.length===0){
    cx.font=`bold 11px ${FONT}`;cx.textAlign='center';cx.textBaseline='middle';
    cx.fillStyle='rgba(0,255,255,0.35)';cx.fillText('Henüz kayıt yok. İlk sen ol!',W/2,H/2);
    cx.textBaseline='alphabetic';
  }

  cx.restore();
}

// ── Audio System ──────────────────────────────────────────────────────────────
const Audio={
  ctx:null, muted:false, _bgNode:null, _bgGain:null,
  init(){
    if(this.ctx)return;
    try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    this._m=this.ctx.createGain();this._m.gain.value=0.5;this._m.connect(this.ctx.destination);
  },
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  _tone(freq,type,dur,vol,freqEnd,d=0){
    if(!this.ctx||this.muted)return;
    const t=this.ctx.currentTime+d;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(freqEnd)o.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd),t+dur*0.85);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this._m);o.start(t);o.stop(t+dur+0.05);
  },
  _noise(dur,vol,cf=2000,d=0){
    if(!this.ctx||this.muted)return;
    const t=this.ctx.currentTime+d,n=this.ctx.sampleRate*Math.min(dur+0.1,2);
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=cf;f.Q.value=0.8;
    const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f);f.connect(g);g.connect(this._m);src.start(t);src.stop(t+dur+0.05);
  },
  latch(){},
  sling(){this.init();this.resume();this._tone(320,'sawtooth',0.18,0.22,80);this._noise(0.2,0.1,1200);this._tone(600,'sine',0.1,0.12,200,0.04);},
  combo(n){this.init();this.resume();const f=[330,392,440,523,587,659,784,880][Math.min(n-1,7)];this._tone(f,'sine',0.22,0.28,f*1.5);this._tone(f*2,'sine',0.14,0.1,f*3,0.06);},
  zoneChange(){this.init();this.resume();this._tone(110,'sine',0.6,0.18,220);this._tone(165,'sine',0.5,0.14,330,0.1);this._tone(220,'triangle',0.4,0.16,440,0.2);this._noise(0.3,0.05,400);},
  bonus(){this.init();this.resume();this._tone(880,'sine',0.2,0.22,1200);this._tone(1320,'sine',0.12,0.12,1760,0.08);},
  death(){this.init();this.resume();this._noise(0.8,0.45,200);this._noise(0.5,0.28,600,0.05);this._tone(80,'sawtooth',0.6,0.28,30);this._tone(50,'square',0.8,0.18,20,0.1);},
  blackholeStart(){
    this.init();this.resume();if(this._bgNode){try{this._bgNode.stop();}catch(e){}}
    if(!this.ctx||this.muted)return;
    const now=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),lfo=this.ctx.createOscillator(),lg=this.ctx.createGain(),g=this.ctx.createGain();
    o.type='sawtooth';o.frequency.value=40;lfo.type='sine';lfo.frequency.value=3;lg.gain.value=12;
    lfo.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(0.16,now+0.5);
    o.connect(g);g.connect(this._m);o.start(now);lfo.start(now);this._bgNode=o;this._bgGain=g;
  },
  blackholeStop(){
    if(this._bgNode&&this.ctx){try{this._bgGain.gain.linearRampToValueAtTime(0,this.ctx.currentTime+0.3);this._bgNode.stop(this.ctx.currentTime+0.35);}catch(e){}this._bgNode=null;}
  },
  heatWarning(){this.init();this.resume();this._noise(0.15,0.1,3000);this._tone(200,'sawtooth',0.15,0.08,400,0.04);},
  click(){this.init();this.resume();this._tone(600,'sine',0.06,0.14,400);},
  asteroid(){this.init();this.resume();this._noise(0.3,0.32,800);this._tone(120,'square',0.2,0.18,60);},
};

// ── Loop ───────────────────────────────────────────────────────────────────
function loop(ts){
  try{update(ts);draw(ts);}
  catch(e){console.error('NOVA SLING ERROR:',e.message,e.stack?.split('\n')[1]);}
  requestAnimationFrame(loop);
}
// Error display overlay
window.onerror=function(msg,src,line,col,err){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;top:0;left:0;right:0;background:rgba(200,0,0,0.92);color:#fff;font:bold 12px monospace;padding:8px;z-index:9999;word-break:break-all;';
  d.textContent=`ERR L${line}:${col} — ${msg}`;
  document.body.appendChild(d);
  return false;
};
requestAnimationFrame(ts=>{lastT=ts;loop(ts);});
</script>
