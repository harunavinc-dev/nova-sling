  const _orig=CanvasRenderingContext2D.prototype.createRadialGradient;
  CanvasRenderingContext2D.prototype.createRadialGradient=function(x0,y0,r0,x1,y1,r1){
    return _orig.call(this,x0,y0,Math.max(0,r0||0),x1,y1,Math.max(0.001,r1||0.001));
  };
})();

let W=window.innerWidth;
let H=window.innerHeight;

function resizeCanvas(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  cx.setTransform(1,0,0,1,0,0); // reset transform first
  cx.scale(DPR,DPR);
  cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
}
resizeCanvas();

let _resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(_resizeTimer);
  _resizeTimer=setTimeout(resizeCanvas,150); // debounce 150ms
});

(function checkDailyLogin(){
  const today=new Date().toISOString().slice(0,10);
  if(lastLoginDay===today)return; // already logged in today
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(lastLoginDay===yesterday){
    loginStreak++;
  } else if(lastLoginDay!==''){
    loginStreak=1; // streak broken
  } else {
    loginStreak=1; // first ever login
  }
  lastLoginDay=today;
  save('login_streak',loginStreak);
  save('last_login_day',lastLoginDay);
  // Unlock ships if streak reached
  const owned=load('owned',['arrow']);
  let changed=false;
  if(loginStreak>=10&&!owned.includes('feniks')){owned.push('feniks');changed=true;}
  if(loginStreak>=30&&!owned.includes('void')){owned.push('void');changed=true;}
  if(changed)save('owned',owned);
})();

// ── Spawn ──────────────────────────────────────────────────────────────────
function spawnPlanets(topY,n){
  let cy=topY;
  let lastType=null;
  for(let i=0;i<n;i++){
    const km=Math.max(0,Math.floor((startY-cy)/10));
    const z=getZone(km);
    // Pick type — never spawn black hole twice in a row
    let type;
    const pool=z.types.filter(t=>!(t==='black'&&lastType==='black'));
    type=pool[ri(0,pool.length-1)];
    lastType=type;
    cy-=rnd(...z.sp);
    // Enforce minimum gap after black hole
    if(type==='black')cy-=rnd(80,140);
    const x=rnd(W*0.1,W*0.9);
    // Subtype for blue planets
    const subtype=type==='blue'?SOLAR_PLANETS[ri(0,SOLAR_PLANETS.length-1)]:type;
    // Size: sun bigger, saturn bigger for rings
    const r=type==='black'?ri(22,32):type==='red'?ri(44,62):
      subtype==='jupiter'?ri(36,48):subtype==='saturn'?ri(32,42):
      subtype==='neptune'?ri(28,36):subtype==='uranus'?ri(26,34):
      subtype==='mercury'||subtype==='moon'?ri(14,22):ri(22,32);
    // Belt only on Saturn
    const hasBelt=subtype==='saturn';
    const beltR=hasBelt?r+rnd(...z.br):0;
    const beltAsts=[];
    if(hasBelt){const nb=ri(...z.ba);for(let j=0;j<nb;j++)beltAsts.push({ang:(j/nb)*Math.PI*2,spd:rnd(0.006,0.024)*(Math.random()<0.5?1:-1),sz:ri(4,9)});}
    // Zone 1 (asteroid belt): 1/5 density of zone 2+, zone 2+: full density
    const moverChance=z.id===1?0.06:z.id>=2?0.3:0;
    const hasMover=moverChance>0&&Math.random()<moverChance;
    const movers=[];
    if(hasMover){for(let j=0;j<ri(1,3);j++)movers.push({x:rnd(W*0.05,W*0.95),y:cy+rnd(-150,150),vx:rnd(-1.3,1.3),vy:rnd(-0.5,0.5),sz:ri(7,14),ang:rnd(0,Math.PI*2),angSpd:rnd(-0.01,0.01),verts:null});}
    planets.push({x,y:cy,r,type,subtype,pal:PPAL[type],
      gravR:type==='black'?260*z.gm:0,heatR:type==='red'?0.006*z.hm:0,
      hasBelt,beltR,beltAsts,movers,
      rotA:rnd(0,Math.PI*2),pulse:rnd(0,Math.PI*2),zid:z.id});
  }
}

function checkZone(force=false){
  const z=getZone(scoreKm);
  if(z.id!==curZoneId||force){
    const prev=curZoneId;curZoneId=z.id;tBgCol=z.sky;
    if(z.id>prev)Audio.zoneChange();
    if(!force&&prev>=0){
      const bonus=z.mult*150;score+=bonus;
      announce={on:true,life:3.5,zone:z,bonus:`+${bonus} BÖLGE BONUSU`};
      flashAlpha=0.55;flashCol=z.wc;shakeX=rnd(-7,7);shakeY=rnd(-7,7);
    } else if(force){bgCol=z.sky;announce={on:true,life:2.5,zone:z,bonus:''};}
  }
}

// ── Orbit ──────────────────────────────────────────────────────────────────
const MAX_SPIN_MULT=3.5; // max speed multiplier from spinning
const SPIN_PER_ROT=0.55; // multiplier gained per full rotation

function tryGrab(){
  let best_=null,bestD=ROPE_LEN;
  for(const p of planets){
    const dd=d2(probe.x,probe.y,p.x,p.y);
    if(dd<ROPE_LEN&&dd>p.r+PROBE_R*2&&dd<bestD){bestD=dd;best_=p;}
  }
  if(best_){
    const dx=probe.x-best_.x,dy=probe.y-best_.y;
    const r=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx);
    let omega=(probe.vx*(-Math.sin(ang))+probe.vy*Math.cos(ang))/r;
    if(Math.abs(omega)<0.03)omega=0.04*(omega<0?-1:1);
    omega=clamp(omega,-0.14,0.14);
    orb={
      planet:best_,ang,r,omega,heat:0,
      rotations:0,          // full rotations completed
      angAccum:0,           // accumulated angle (absolute)
      spinMult:1.0,         // speed multiplier built up by spinning
      graceTime: best_.type==='black' ? 1.8 : 0, // black hole escape window (seconds)
      warned:false,
    };
    phase='ORBITING';
    emitSpark(probe.x,probe.y,14,trailCol(),2.5);
    if(best_.type==='black')Audio.blackholeStart();
  }
}

function release(){
  if(!orb)return;
  const{ang,r,omega,spinMult}=orb;
  // Exit speed boosted by spin multiplier
  const baseSpd=Math.abs(omega*r);
  const spd=clamp(baseSpd*spinMult,1.8,MAX_SPEED*spinMult*0.6);
  const dir=omega>0?1:-1;
  probe.vx=-Math.sin(ang)*spd*dir;probe.vy=Math.cos(ang)*spd*dir;
  const newPlanet=lastOrbitPlanet!==orb.planet;
  if(newPlanet)lastOrbitPlanet=orb.planet;
  if(newPlanet)score+=getZone(scoreKm).mult; // sadece yeni gezegene geçince skor
  const cappedRotations=Math.min(orb.rotations, 3);
  if(cappedRotations>=1&&newPlanet)score+=Math.floor(cappedRotations*orb.spinMult*10*getZone(scoreKm).mult);
  if(orb.planet.type==='black')Audio.blackholeStop();
  orb=null;phase='FLYING';
  Audio.sling();
  emitSpark(probe.x,probe.y,Math.floor(18+spinMult*8),trailCol(),2.5+spinMult);
}

const SPARK_MAX=120;
function emitSpark(x,y,n,col,spd){
  const add=Math.min(n, SPARK_MAX-sparks.length);
  for(let i=0;i<add;i++){const a=rnd(0,Math.PI*2);sparks.push({x,y,vx:Math.cos(a)*rnd(0.5,spd),vy:Math.sin(a)*rnd(0.5,spd),life:1,col,sz:ri(2,4)});}
}

// ── Death ──────────────────────────────────────────────────────────────────
function die(reason){
  if(phase==='DEAD'||phase==='MENU')return;
  if(respawnGrace>0)return; // invincible during grace period
  if(reason==='planet'){Audio.death();emitSpark(probe.x,probe.y,60,'#ff6622',8);emitSpark(probe.x,probe.y,40,'#ffaa00',5);}
  else if(reason==='oob')Audio.death();
  else if(reason==='burn'){Audio.heatWarning();setTimeout(()=>Audio.death(),100);emitSpark(probe.x,probe.y,50,'#ff8800',7);}
  else if(reason==='blackhole'){Audio.blackholeStop();Audio.death();emitSpark(probe.x,probe.y,50,'#cc00ff',6);}
  else if(reason==='asteroid'){Audio.asteroid();emitSpark(probe.x,probe.y,45,'#ffaa44',7);}
  if(orb&&orb.planet.type==='black')Audio.blackholeStop();
  emitSpark(probe.x,probe.y,80,reason==='blackhole'?'#cc00ff':reason==='asteroid'?'#ffaa00':'#ff4400',6);
  orb=null;

  if(lives>0){
    lives--;
    phase='DEAD';
    flashAlpha=1;flashCol=reason==='blackhole'?'#cc00ff':'#ff2200';
    shakeX=rnd(-8,8);shakeY=rnd(-8,8);

    // Find nearest safe planet in world coords
    const nearest=planets
      .filter(p=>p.type!=='black'&&p.type!=='red')
      .sort((a,b)=>d2(a.x,a.y,probe.x,probe.y)-d2(b.x,b.y,probe.x,probe.y))[0];

    let spawnX,spawnY;
    if(nearest){
      // Spawn directly above nearest planet, no complex checks needed
      // respawnGrace=180 will protect from immediate collision
      spawnX=nearest.x;
      spawnY=nearest.y-(nearest.r+110);
    } else {
      // No planet found — spawn above current position
      spawnX=probe.x;
      spawnY=probe.y-200;
    }

    probe.x=spawnX;probe.y=spawnY;
    probe.vx=0;probe.vy=-4;
    probe.ang=-Math.PI/2;
    probe.trail=[];probe.trail2=[];probe.trail3=[];probe.trail4=[];
    cam.x=spawnX-W*0.5;
    cam.y=spawnY-H*0.6;
    respawnGrace=180; // 3 seconds invincibility
    phase='FLYING';
    return;
  }
  // No lives left — game over
  if(score>best){best=score;save('best',best);}
  earnedCoins=Math.max(5,Math.floor(scoreKm*0.6+score*0.02));
  coins+=earnedCoins;saveAll();
  phase='DEAD';flashAlpha=1;flashCol='#ff2200';shakeX=rnd(-10,10);shakeY=rnd(-10,10);
  deathMsg=T_.death[reason]||T_.death.planet;
  if(score>0)submitScore(nickname||'Anonim',score,scoreKm);
}

// ── Update ─────────────────────────────────────────────────────────────────
// ── Trail recorder — pooled objects to minimize GC ───────────────────────
const _trailPool=Array.from({length:600},()=>({x:0,y:0}));
let _trailPoolIdx=0;
function _trailPt(x,y){const p=_trailPool[_trailPoolIdx++%600];p.x=x;p.y=y;return p;}
function recordTrail(){
  const _sd=selShipDef();
  const _tS=_sd.S||7.5;
  const _tOff=_tS*4.5*0.3;
  const _ca=Math.cos(probe.ang),_sa=Math.sin(probe.ang);
  const _tx=probe.x-_ca*_tOff, _ty=probe.y-_sa*_tOff;
  const pushArr=(arr,x,y)=>{if(arr.length>=TRAIL_LEN)arr.shift();arr.push(_trailPt(x,y));};
  if(_sd.quadExhaust){
    const _cp=Math.cos(probe.ang+Math.PI*0.5),_sp=Math.sin(probe.ang+Math.PI*0.5);
    const _eA=_tS*4.5*0.28,_eB=_tS*4.5*0.09;
    pushArr(probe.trail, _tx+_cp*_eA, _ty+_sp*_eA);
    pushArr(probe.trail2,_tx+_cp*_eB, _ty+_sp*_eB);
    pushArr(probe.trail3,_tx-_cp*_eB, _ty-_sp*_eB);
    pushArr(probe.trail4,_tx-_cp*_eA, _ty-_sp*_eA);
  } else if(_sd.dualExhaust){
    const _cp=Math.cos(probe.ang+Math.PI*0.5),_sp=Math.sin(probe.ang+Math.PI*0.5);
    const _eO=_tS*4.5*0.22;
    pushArr(probe.trail, _tx+_cp*_eO, _ty+_sp*_eO);
    pushArr(probe.trail2,_tx-_cp*_eO, _ty-_sp*_eO);
  } else {
    pushArr(probe.trail,_tx,_ty);
  }
}

function update(ts){
  if(lastT===0){lastT=ts;requestAnimationFrame(loop);return;}const dt=Math.min((ts-lastT)/16.67,1.5);lastT=ts;tick++;
  if(paused||phase!=='FLYING'&&phase!=='ORBITING')return;

  bgCol=lerpHex(bgCol,tBgCol,0.018);
  if(announce.on){announce.life-=dt*0.017*60;if(announce.life<=0)announce.on=false;}
  flashAlpha=Math.max(0,flashAlpha-0.035*dt);
  shakeX*=Math.pow(0.84,dt);shakeY*=Math.pow(0.84,dt);

  if(phase==='FLYING'){
    if(holding)tryGrab();
    for(const p of planets){
      if(p.type==='black'&&p.gravR>0){
        const dx=p.x-probe.x,dy=p.y-probe.y,dd=Math.sqrt(dx*dx+dy*dy);
        if(dd<p.gravR&&dd>1){const f=0.28*(1-dd/p.gravR)*dt;probe.vx+=(dx/dd)*f;probe.vy+=(dy/dd)*f;}
      }
    }
    probe.x+=probe.vx*dt;probe.y+=probe.vy*dt;
    probe.vx*=Math.pow(0.9985,dt);probe.vy*=Math.pow(0.9985,dt);
    const spd=Math.sqrt(probe.vx**2+probe.vy**2);if(spd>0&&spd<0.72){const s=0.72/spd;probe.vx*=s;probe.vy*=s;}
    probe.ang=Math.atan2(probe.vy,probe.vx);

    recordTrail();

    const nkm=Math.max(0,Math.floor((startY-probe.y)/10));
    const z=getZone(scoreKm);
    if(nkm>scoreKm){scoreKm=nkm;score=Math.max(score,nkm);checkZone();}
    if(respawnGrace>0){
      respawnGrace--;
      // Flash during grace period
      if(respawnGrace%8<4)flashAlpha=Math.max(flashAlpha,0.15);
    }
    if(respawnGrace<=0&&probe.x<-160||probe.x>W+160)die('oob');
    if(probe.y>startY+H*2)die('oob');
    if(respawnGrace<=0){
      for(const p of planets){
        if(d2(probe.x,probe.y,p.x,p.y)<p.r+PROBE_R)die('planet');
        for(const a of p.beltAsts){const ax=p.x+Math.cos(a.ang)*p.beltR,ay=p.y+Math.sin(a.ang)*p.beltR;if(d2(probe.x,probe.y,ax,ay)<a.sz+PROBE_R)die('asteroid');}
        for(const mv of p.movers){if(d2(probe.x,probe.y,mv.x,mv.y)<mv.sz+PROBE_R)die('asteroid');}
      }
    }
    const top=planets.reduce((m,p)=>p.y<m?p.y:m,probe.y);
    if(probe.y-H*2<top)spawnPlanets(top,7);
    planets=planets.filter(p=>p.y<probe.y+H*2.5);
  } else if(phase==='ORBITING'){
    const p=orb.planet;

    // Spin-up: angular velocity increases each frame (non-black-hole)
    if(p.type!=='black'){
      const sign=orb.omega>0?1:-1;
      orb.omega+=sign*0.0015*dt;
      orb.omega=clamp(orb.omega,-0.28,0.28);
    }

    // Track accumulated angle to count rotations
    orb.angAccum=(orb.angAccum||0)+Math.abs(orb.omega*dt);
    const prevRot=Math.floor(orb.rotations||0);
    orb.rotations=orb.angAccum/(Math.PI*2);
    if(Math.floor(orb.rotations)>prevRot){
      orb.spinMult=Math.min(MAX_SPIN_MULT,1+(Math.floor(orb.rotations)*SPIN_PER_ROT));
      emitSpark(probe.x,probe.y,6,trailCol(),orb.spinMult);
    }

    orb.ang+=orb.omega*dt;
    probe.x=p.x+Math.cos(orb.ang)*orb.r;probe.y=p.y+Math.sin(orb.ang)*orb.r;
    // Ship faces tangent direction of orbit (parallel to planet surface)
    probe.ang=orb.ang+(orb.omega>0?Math.PI/2:-Math.PI/2);

    recordTrail();

    // Red giant heat
    if(p.type==='red'){
      orb.heat+=p.heatR*dt;
      if(orb.heat>=1){probe.vx=Math.cos(orb.ang)*rnd(4,7)+rnd(-2,2);probe.vy=Math.sin(orb.ang)*rnd(4,7)+rnd(-2,2);emitSpark(probe.x,probe.y,30,'#ff6600',4);Audio.blackholeStop();orb=null;phase='FLYING';}
    }

    // Black hole: grace period then slow pull
    if(p.type==='black'){
      if(orb.graceTime>0){
        orb.graceTime-=dt;
        if(orb.graceTime<0.7&&!orb.warned){orb.warned=true;flashAlpha=0.25;flashCol='#cc00ff';}
      } else {
        orb.omega*=Math.pow(1.003,dt);
        orb.r=Math.max(orb.r-0.18*dt,p.r+PROBE_R+2);
        if(orb.r<=p.r+PROBE_R+3.5)die('blackhole');
      }
    }

    if(!holding)release();
    if(phase==='FLYING'){const nkm=Math.max(0,Math.floor((startY-probe.y)/10));if(nkm>scoreKm){scoreKm=nkm;checkZone();}}

    // Collision with OTHER planets while orbiting
    if(phase==='ORBITING'&&respawnGrace<=0){
      for(const op of planets){
        if(op===orb.planet)continue;
        if(d2(probe.x,probe.y,op.x,op.y)<op.r+PROBE_R){
          die('planet');break;
        }
      }
    }
  }

  for(const p of planets){
    p.rotA+=0.002*dt;p.pulse+=0.025*dt;
    for(const a of p.beltAsts)a.ang+=a.spd*dt;
    for(const mv of p.movers){
      mv.x+=mv.vx*dt;mv.y+=mv.vy*dt;
      mv.ang=(mv.ang||0)+(mv.angSpd||0.005)*dt;
      if(mv.x<cam.x-50||mv.x>cam.x+W+50){mv.vx*=-1;}
    }
  }

  // ── Heart pickups ────────────────────────────────────────────────────────
  if(hearts.length<2&&lives<maxLives&&tick%180===0){
    const curZone=getZone(scoreKm);
    const isChaos=curZone.id===3;
    const lastKm=hearts.length>0?Math.max(...hearts.map(h=>h.spawnKm)):0;
    const kmGap=isChaos?2000:1000; // chaos: rarer
    if(scoreKm-lastKm>=kmGap||(hearts.length===0&&scoreKm>50)){
      if(isChaos){
        // Chaos: very rare (5%), float in space (no safe planet to orbit)
        if(Math.random()<0.05){
          const floatX=cam.x+W*(0.2+Math.random()*0.6);
          const floatY=cam.y+H*(0.1+Math.random()*0.3);
          hearts.push({planet:null,floatX,floatY,orbitR:0,ang:0,life:1,pulse:Math.random()*Math.PI*2,spawnKm:scoreKm});
        }
      } else {
        const visiblePlanets=planets.filter(p=>p.type!=='red'&&p.type!=='black'
          &&Math.abs(sx(p.x)-W/2)<W*0.8
          &&sy(p.y)>30&&sy(p.y)<H*0.45);
        if(visiblePlanets.length>0){
          const p=visiblePlanets[Math.floor(Math.random()*visiblePlanets.length)];
          const already=hearts.some(h=>h.planet===p);
          if(!already){
            const ang=Math.random()*Math.PI*2;
            hearts.push({planet:p,orbitR:p.r+105,ang,life:1,pulse:Math.random()*Math.PI*2,spawnKm:scoreKm});
          }
        }
      }
    }
  }
  // Update hearts — pulse animation only, no rotation
  for(const h of hearts){
    if(h.life<=0)continue;
    h.pulse+=0.07*dt;
    const wx=h.planet?h.planet.x+Math.cos(h.ang)*h.orbitR:h.floatX;
    const wy=h.planet?h.planet.y+Math.sin(h.ang)*h.orbitR:h.floatY;
    if(d2(probe.x,probe.y,wx,wy)<28&&lives<maxLives){
      lives=Math.min(lives+1,maxLives);
      h.life=0;
      emitSpark(probe.x,probe.y,24,'#ff4488',4);
      Audio.bonus();
    }
    const screenY=h.planet?sy(h.planet.y):sy(h.floatY);
    if(screenY>H*2.5)h.life=0;
  }
  hearts=hearts.filter(h=>h.life>0);
  cam.x=lerp(cam.x,probe.x-W*0.5,0.06*dt);cam.y=lerp(cam.y,probe.y-H*0.65,0.06*dt);
  sparks=sparks.filter(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=Math.pow(0.9,dt);s.vy*=Math.pow(0.9,dt);s.life-=0.03*dt;return s.life>0;});

}

function sx(wx){return wx-cam.x+shakeX;}
function sy(wy){return wy-cam.y+shakeY;}

function lerpHex(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=Math.round(((pa>>16)&0xff)+t*(((pb>>16)&0xff)-((pa>>16)&0xff)));
  const g=Math.round(((pa>>8)&0xff)+t*(((pb>>8)&0xff)-((pa>>8)&0xff)));
  const bl=Math.round((pa&0xff)+t*((pb&0xff)-(pa&0xff)));
  return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${bl.toString(16).padStart(2,'0')}`;
}

// ── Draw planet — realistic gradients, glow, atmosphere ────────────────────
// ── Planet offscreen cache ────────────────────────────────────────────────
const _pCache = new Map();
function _clearPlanetCache(){_pCache.clear();}
function _getCachedPlanet(p, t) {
  const sub = p.subtype || p.type;
  const animated = (sub === 'red' || sub === 'black');
  // Static planets: cache by sub+size only (rotation handled in drawPlanet)
  // Animated planets: include time bucket so they update
  const rotBucket = animated ? Math.floor((p.rotA % (Math.PI*2)) / (Math.PI*2) * 16) : 0;
  const sizeBucket = Math.round(p.r);
  const key = `${sub}_${sizeBucket}_${rotBucket}`;
  if (_pCache.has(key)) return _pCache.get(key);
  if (_pCache.size > 60) {
    // Evict oldest
    const firstKey = _pCache.keys().next().value;
    _pCache.delete(firstKey);
  }
  const pad = Math.ceil(p.r * 2.5) + 4;
  const sz = pad * 2;
  const oc = document.createElement('canvas');
  oc.width = sz; oc.height = sz;
  const octx = oc.getContext('2d', {alpha:true});
  drawPlanet(p, pad, pad, t, octx);
  _pCache.set(key, {canvas: oc, pad});
  return {canvas: oc, pad};
}

function drawPlanet(p,ppx,ppy,t,ctx){
  const r=p.r, sub=p.subtype||p.type;
  const rot=p.rotA;

  function RG(x0,y0,r0,x1,y1,r1,...s){
    const g=ctx.createRadialGradient(x0,y0,Math.max(0,r0),x1,y1,Math.max(0.001,r1));
    for(let i=0;i<s.length;i+=2)g.addColorStop(s[i],s[i+1]);return g;
  }
  function LG(x0,y0,x1,y1,...s){
    const g=ctx.createLinearGradient(x0,y0,x1,y1);
    for(let i=0;i<s.length;i+=2)g.addColorStop(s[i],s[i+1]);return g;
  }
  function sphere(){ctx.beginPath();ctx.arc(ppx,ppy,r,0,Math.PI*2);}
  function clip(){ctx.save();sphere();ctx.clip();}
  function atmo(col,width=0.12,alpha=0.6){
    ctx.fillStyle=RG(ppx,ppy,r*0.92,ppx,ppy,r*(1+width),0,'transparent',0.4,'transparent',1,col);
    ctx.globalAlpha=alpha;sphere();ctx.fill();ctx.globalAlpha=1;
  }
  function terminator(str=0.88){
    ctx.fillStyle=RG(ppx+r*0.38,ppy+r*0.05,r*0.1,ppx+r*0.15,ppy,r,
      0,'transparent',0.38,'transparent',0.62,`rgba(0,0,0,${str*0.5})`,0.82,`rgba(0,0,0,${str*0.82})`,1,`rgba(0,0,0,${str})`);
    sphere();ctx.fill();
  }
  function specular(ix=-0.42,iy=-0.45,str=0.6,radius=0.48){
    ctx.fillStyle=RG(ppx+r*ix,ppy+r*iy,0,ppx+r*ix*0.5,ppy+r*iy*0.5,r*radius,
      0,`rgba(255,255,255,${str})`,0.4,`rgba(255,255,255,${str*0.18})`,1,'transparent');
    sphere();ctx.fill();
  }
  function rimLight(col='rgba(120,160,255,0.35)'){
    ctx.strokeStyle=col;ctx.lineWidth=r*0.04;
    sphere();ctx.stroke();
  }

  ctx.save();

  if(sub==='earth'){
    // Deep ocean base
    ctx.fillStyle=RG(ppx-r*0.3,ppy-r*0.3,r*0.05,ppx+r*0.1,ppy+r*0.1,r,
      0,'#4a9ed4',0.25,'#2268b0',0.55,'#0c3d85',0.8,'#071f55',1,'#020c22');
    sphere();ctx.fill();
    clip();
    const ca=Math.cos(rot*0.09),sa=Math.sin(rot*0.09);
    // Continents — multiple overlapping blobs for realistic shapes
    const continents=[
      {dx:-0.28,dy:-0.22,rx:0.35,ry:0.28,angle:0.3,c1:'#3a7a35',c2:'#22552a'},// Americas
      {dx:0.18,dy:-0.18,rx:0.28,ry:0.32,angle:-0.2,c1:'#3d7c38',c2:'#255030'},// Europe/Africa
      {dx:0.38,dy:-0.08,rx:0.22,ry:0.26,angle:0.4,c1:'#4a8042',c2:'#2d5832'},// Asia
      {dx:0.32,dy:0.28,rx:0.18,ry:0.14,angle:-0.3,c1:'#7a9648',c2:'#4d6830'},// Australia
      {dx:-0.08,dy:0.32,rx:0.14,ry:0.1,angle:0.1,c1:'#488042',c2:'#2d5432'},// S.America tip
    ];
    continents.forEach(c=>{
      const ox=ppx+(c.dx*ca-c.dy*sa)*r;
      const oy=ppy+(c.dx*sa+c.dy*ca)*r;
      // Continent gradient — lighter toward center
      ctx.fillStyle=RG(ox,oy,0,ox,oy,r*Math.max(c.rx,c.ry),0,c.c1,0.5,c.c2,1,c.c2+'88');
      ctx.beginPath();ctx.ellipse(ox,oy,r*c.rx,r*c.ry,c.angle,0,Math.PI*2);ctx.fill();
      // Mountain/terrain highlight
      ctx.fillStyle=`rgba(200,220,150,0.15)`;
      ctx.beginPath();ctx.ellipse(ox-r*0.04,oy-r*0.04,r*c.rx*0.45,r*c.ry*0.45,c.angle,0,Math.PI*2);ctx.fill();
    });
    // Polar ice caps
    ctx.fillStyle=RG(ppx,ppy-r*0.88,0,ppx,ppy-r*0.72,r*0.52,0,'rgba(240,252,255,0.98)',0.6,'rgba(220,240,255,0.7)',1,'transparent');
    ctx.fillRect(ppx-r,ppy-r,r*2,r*0.55);
    ctx.fillStyle=RG(ppx,ppy+r*0.88,0,ppx,ppy+r*0.72,r*0.45,0,'rgba(240,252,255,0.95)',0.6,'rgba(220,240,255,0.65)',1,'transparent');
    ctx.fillRect(ppx-r,ppy+r*0.55,r*2,r*0.5);
    // Cloud layer — multiple bands
    ctx.globalAlpha=0.72;
    [{y:-0.18,h:0.09,r:0.78,a:rot*0.03},{y:0.05,h:0.11,r:0.88,a:rot*0.04+0.8},{y:0.25,h:0.07,r:0.72,a:rot*0.035+1.6}].forEach(cl=>{
      ctx.fillStyle=RG(ppx+cl.r*r*0.2,ppy+cl.y*r,0,ppx,ppy+cl.y*r,r*0.9,0,'transparent',0.25,'rgba(255,255,255,0.65)',0.55,'rgba(255,255,255,0.5)',0.85,'transparent',1,'transparent');
      ctx.save();ctx.translate(ppx,ppy+cl.y*r);ctx.rotate(cl.a);
      ctx.fillRect(-r,-cl.h*r,r*2,cl.h*r*2);ctx.restore();
    });
    ctx.globalAlpha=1;
    ctx.restore();
    terminator(0.82);specular(-0.38,-0.42,0.55,0.52);
    atmo('rgba(80,140,210,0.45)',0.13,0.6);rimLight('rgba(80,140,200,0.3)');

  }else if(sub==='mars'){
    ctx.fillStyle=RG(ppx-r*0.28,ppy-r*0.25,r*0.05,ppx+r*0.1,ppy+r*0.1,r,
      0,'#c96840',0.22,'#b84e24',0.5,'#9e381c',0.78,'#743010',1,'#3c1008');
    sphere();ctx.fill();
    clip();
    // Surface albedo variations
    ctx.fillStyle=RG(ppx-r*0.2,ppy+r*0.1,0,ppx-r*0.2,ppy+r*0.1,r*0.65,0,'rgba(155,70,28,0.45)',1,'transparent');
    sphere();ctx.fill();
    ctx.fillStyle=RG(ppx+r*0.3,ppy-r*0.2,0,ppx+r*0.3,ppy-r*0.2,r*0.5,0,'rgba(190,120,60,0.35)',1,'transparent');
    sphere();ctx.fill();
    // Valles Marineris canyon system
    const ca2=Math.cos(rot*0.08),sa2=Math.sin(rot*0.08);
    ctx.strokeStyle='rgba(60,15,5,0.55)';ctx.lineWidth=r*0.055;ctx.lineCap='round';
    ctx.save();ctx.translate(ppx,ppy);ctx.rotate(rot*0.08);
    ctx.beginPath();ctx.moveTo(-r*0.55,r*0.06);ctx.bezierCurveTo(-r*0.15,r*0.03,r*0.15,r*0.08,r*0.5,r*0.02);ctx.stroke();
    ctx.lineWidth=r*0.028;
    ctx.beginPath();ctx.moveTo(-r*0.5,r*0.12);ctx.bezierCurveTo(-r*0.1,r*0.08,r*0.2,r*0.14,r*0.45,r*0.08);ctx.stroke();
    ctx.restore();
    // Olympus Mons volcano
    const vx=ppx+((-r*0.28)*ca2-(-r*0.1)*sa2),vy=ppy+((-r*0.28)*sa2+(-r*0.1)*ca2);
    ctx.fillStyle=RG(vx,vy,0,vx,vy,r*0.2,0,'rgba(165,85,42,0.65)',0.5,'rgba(170,70,30,0.5)',1,'transparent');
    ctx.beginPath();ctx.arc(vx,vy,r*0.2,0,Math.PI*2);ctx.fill();
    // Impact craters
    [[0.32,0.24,0.1],[0.2,-0.38,0.09],[-0.3,0.28,0.1],[0.42,-0.18,0.08],[-0.15,0.1,0.06]].forEach(([dx,dy,cr])=>{
      const ox2=ppx+dx*r*ca2-dy*r*sa2,oy2=ppy+dx*r*sa2+dy*r*ca2;
      ctx.strokeStyle='rgba(180,80,40,0.5)';ctx.lineWidth=r*cr*0.22;
      ctx.beginPath();ctx.arc(ox2,oy2,r*cr,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=RG(ox2,oy2,0,ox2,oy2,r*cr,0,'rgba(55,12,4,0.6)',1,'transparent');
      ctx.beginPath();ctx.arc(ox2,oy2,r*cr,0,Math.PI*2);ctx.fill();
    });
    // Dust storm
    ctx.globalAlpha=0.28+0.12*Math.sin(t*0.4+1.5);
    ctx.fillStyle=RG(ppx+r*0.1,ppy+r*0.15,0,ppx+r*0.1,ppy+r*0.15,r*0.42,0,'rgba(220,130,60,0.7)',1,'transparent');
    ctx.beginPath();ctx.ellipse(ppx+r*0.1,ppy+r*0.15,r*0.42,r*0.22,0.4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    // Polar ice
    ctx.fillStyle=RG(ppx,ppy-r*0.84,0,ppx,ppy-r*0.72,r*0.42,0,'rgba(240,240,255,0.92)',1,'transparent');
    ctx.fillRect(ppx-r,ppy-r,r*2,r*0.52);
    ctx.restore();
    terminator(0.86);specular(-0.36,-0.4,0.42,0.48);
    atmo('rgba(170,85,42,0.28)',0.1,0.55);rimLight('rgba(155,75,38,0.22)');

  }else if(sub==='jupiter'){
    // Base
    ctx.fillStyle=RG(ppx-r*0.22,ppy-r*0.22,r*0.05,ppx+r*0.1,ppy+r*0.1,r,
      0,'#dfc485',0.28,'#cfa05c',0.55,'#aa6a30',0.78,'#6e3c14',1,'#2e1804');
    sphere();ctx.fill();
    clip();
    // Atmospheric bands — detailed
    const bands=[
      {y:-0.78,h:0.12,c:'rgba(185,148,88,0.42)'},
      {y:-0.62,h:0.14,c:'rgba(142,88,40,0.48)'},
      {y:-0.44,h:0.16,c:'rgba(208,170,110,0.4)'},
      {y:-0.24,h:0.18,c:'rgba(132,76,32,0.46)'},
      {y:-0.02,h:0.2,c:'rgba(198,158,92,0.4)'},
      {y:0.2,h:0.18,c:'rgba(128,74,30,0.46)'},
      {y:0.4,h:0.16,c:'rgba(200,162,98,0.38)'},
      {y:0.58,h:0.14,c:'rgba(134,80,34,0.44)'},
      {y:0.74,h:0.12,c:'rgba(178,140,80,0.4)'},
    ];
    bands.forEach(b=>{
      ctx.fillStyle=b.c;
      ctx.beginPath();ctx.ellipse(ppx,ppy+b.y*r,r,b.h*r*0.5,0,0,Math.PI*2);ctx.fill();
    });
    // Band turbulence waves
    for(let wi=0;wi<8;wi++){
      const wy=-0.7+wi*0.18,wamp=r*0.025;
      ctx.strokeStyle=`rgba(${180+wi*5},${120+wi*8},${50+wi*4},0.2)`;ctx.lineWidth=r*0.012;
      ctx.beginPath();
      for(let wx2=-1;wx2<=1;wx2+=0.05){
        const bx=ppx+wx2*r,by=ppy+wy*r+Math.sin(wx2*8+rot*0.5+wi)*wamp;
        wx2===-1?ctx.moveTo(bx,by):ctx.lineTo(bx,by);
      }
      ctx.stroke();
    }
    // Great Red Spot
    const grx=ppx+Math.cos(rot*0.12)*r*0.2,gry=ppy+r*0.14;
    ctx.fillStyle=RG(grx,gry,r*0.03,grx,gry,r*0.22,0,'rgba(168,55,24,0.78)',0.35,'rgba(150,40,18,0.62)',0.7,'rgba(168,100,50,0.32)',1,'transparent');
    ctx.beginPath();ctx.ellipse(grx,gry,r*0.22,r*0.13,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(150,38,15,0.45)';ctx.lineWidth=r*0.018;
    ctx.beginPath();ctx.ellipse(grx,gry,r*0.18,r*0.1,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    // Limb darkening
    ctx.fillStyle=RG(ppx,ppy,r*0.45,ppx,ppy,r,0,'transparent',0.55,'rgba(15,8,0,0.08)',0.78,'rgba(10,5,0,0.28)',1,'rgba(5,2,0,0.55)');
    sphere();ctx.fill();
    specular(-0.32,-0.36,0.42,0.55);rimLight('rgba(230,190,120,0.25)');

  }else if(sub==='saturn'){
    // Back rings
    ctx.save();ctx.translate(ppx,ppy);
    const ringGrad=ctx.createRadialGradient(0,0,r*1.15,0,0,r*2.12);
    ringGrad.addColorStop(0,'transparent');
    ringGrad.addColorStop(0.08,'rgba(215,192,148,0.72)');
    ringGrad.addColorStop(0.28,'rgba(198,172,128,0.58)');
    ringGrad.addColorStop(0.45,'rgba(180,155,112,0.38)');
    ringGrad.addColorStop(0.62,'rgba(195,170,125,0.52)');
    ringGrad.addColorStop(0.78,'rgba(172,148,105,0.32)');
    ringGrad.addColorStop(1,'transparent');
    ctx.fillStyle=ringGrad;
    ctx.beginPath();ctx.ellipse(0,0,r*2.12,r*2.12*0.26,0,Math.PI,0);ctx.fill();
    // Cassini division
    ctx.strokeStyle='rgba(12,8,2,0.55)';ctx.lineWidth=r*0.032;
    ctx.beginPath();ctx.ellipse(0,0,r*1.49,r*1.49*0.26,0,Math.PI,0);ctx.stroke();
    ctx.restore();
    // Planet
    ctx.fillStyle=RG(ppx-r*0.22,ppy-r*0.22,r*0.04,ppx+r*0.1,ppy+r*0.1,r,
      0,'#e8d590',0.25,'#d4b862',0.52,'#b08a35',0.78,'#745215',1,'#302205');
    sphere();ctx.fill();
    clip();
    [{y:-0.62,h:0.1,c:'rgba(220,195,125,0.35)'},{y:-0.38,h:0.14,c:'rgba(168,128,58,0.3)'},
     {y:-0.1,h:0.18,c:'rgba(215,185,115,0.32)'},{y:0.12,h:0.14,c:'rgba(165,125,55,0.3)'},
     {y:0.35,h:0.1,c:'rgba(212,180,110,0.28)'}].forEach(b=>{
      ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(ppx,ppy+b.y*r,r,b.h*r*0.5,0,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
    terminator(0.8);specular(-0.34,-0.38,0.44,0.52);
    // Front rings
    ctx.save();ctx.translate(ppx,ppy);ctx.fillStyle=ringGrad;
    ctx.beginPath();ctx.ellipse(0,0,r*2.12,r*2.12*0.26,0,0,Math.PI);ctx.fill();
    ctx.strokeStyle='rgba(12,8,2,0.55)';ctx.lineWidth=r*0.032;
    ctx.beginPath();ctx.ellipse(0,0,r*1.49,r*1.49*0.26,0,0,Math.PI);ctx.stroke();
    ctx.restore();
    rimLight('rgba(235,205,145,0.28)');

  }else if(sub==='uranus'){
    ctx.fillStyle=RG(ppx-r*0.28,ppy-r*0.28,r*0.04,ppx+r*0.1,ppy+r*0.1,r,

    sphere();ctx.fill();

    [{y:-0.55,h:0.12,c:'rgba(145,220,215,0.28)'},{y:-0.2,h:0.18,c:'rgba(100,195,185,0.22)'},
     {y:0.15,h:0.15,c:'rgba(140,215,208,0.25)'},{y:0.45,h:0.1,c:'rgba(95,188,180,0.2)'}].forEach(b=>{
      ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(ppx,ppy+b.y*r,r,b.h*r*0.5,0,0,Math.PI*2);ctx.fill();
    });
    // Subtle polar region
    ctx.fillStyle=RG(ppx,ppy-r*0.75,0,ppx,ppy-r*0.6,r*0.48,0,'rgba(190,240,238,0.42)',1,'transparent');

    // Rings (tilted)
    ctx.save();ctx.translate(ppx,ppy);ctx.rotate(0.3);
    [r*1.38,r*1.52,r*1.68].forEach(rr2=>{
      ctx.strokeStyle='rgba(160,220,215,0.15)';ctx.lineWidth=r*0.018;
      ctx.beginPath();ctx.ellipse(0,0,rr2,rr2*0.1,0,0,Math.PI*2);ctx.stroke();
    });

  }else if(sub==='neptune'){
    ctx.fillStyle=RG(ppx-r*0.26,ppy-r*0.26,r*0.04,ppx+r*0.1,ppy+r*0.1,r,
      0,'#4878d8',0.22,'#2248c0',0.52,'#10289a',0.78,'#071468',1,'#01062a');
    sphere();ctx.fill();
    clip();
    [{y:-0.48,h:0.13,c:'rgba(75,128,255,0.35)'},{y:-0.12,h:0.2,c:'rgba(50,100,240,0.28)'},
     {y:0.2,h:0.15,c:'rgba(70,122,248,0.32)'},{y:0.48,h:0.1,c:'rgba(45,95,235,0.25)'}].forEach(b=>{
      ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(ppx,ppy+b.y*r,r,b.h*r*0.5,0,0,Math.PI*2);ctx.fill();
    });
    // Great Dark Spot
    const gx=ppx+Math.cos(rot*0.14)*r*0.22,gy=ppy-r*0.18;
    ctx.fillStyle=RG(gx,gy,0,gx,gy,r*0.18,0,'rgba(5,12,65,0.72)',0.6,'rgba(8,20,82,0.42)',1,'transparent');
    ctx.beginPath();ctx.ellipse(gx,gy,r*0.18,r*0.1,0.25,0,Math.PI*2);ctx.fill();
    // White cloud companion
    const wx2=ppx+Math.cos(rot*0.14+0.6)*r*0.3,wy2=ppy-r*0.12;
    ctx.fillStyle=RG(wx2,wy2,0,wx2,wy2,r*0.1,0,'rgba(200,220,255,0.75)',1,'transparent');
    ctx.beginPath();ctx.arc(wx2,wy2,r*0.1,0,Math.PI*2);ctx.fill();
    ctx.restore();
    terminator(0.85);specular(-0.38,-0.4,0.52,0.5);
    atmo('rgba(55,98,210,0.38)',0.12,0.62);rimLight('rgba(50,90,195,0.28)');

  }else if(sub==='mercury'){
    ctx.fillStyle=RG(ppx-r*0.3,ppy-r*0.28,r*0.03,ppx+r*0.12,ppy+r*0.12,r,
      0,'#c0b8ac',0.28,'#9e9284',0.58,'#6e6458',0.82,'#363028',1,'#161210');
    sphere();ctx.fill();
    clip();
    // Surface color variations
    ctx.fillStyle=RG(ppx+r*0.15,ppy-r*0.1,0,ppx+r*0.15,ppy-r*0.1,r*0.6,0,'rgba(192,182,168,0.38)',1,'transparent');
    sphere();ctx.fill();
    // Caloris basin
    ctx.strokeStyle='rgba(155,142,125,0.5)';ctx.lineWidth=r*0.048;
    ctx.beginPath();ctx.arc(ppx+r*0.15,ppy-r*0.1,r*0.34,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=RG(ppx+r*0.15,ppy-r*0.1,0,ppx+r*0.15,ppy-r*0.1,r*0.3,0,'rgba(25,20,16,0.38)',1,'transparent');
    ctx.beginPath();ctx.arc(ppx+r*0.15,ppy-r*0.1,r*0.34,0,Math.PI*2);ctx.fill();
    // Craters with ejecta rays
    [[0.32,0.24,0.1],[0.18,-0.38,0.09],[-0.28,0.28,0.1],[0.38,-0.14,0.08],[-0.1,-0.2,0.07],[0.0,0.35,0.06]].forEach(([dx,dy,cr])=>{
      const ox2=ppx+dx*r,oy2=ppy+dy*r;
      // Ejecta rays
      for(let ri2=0;ri2<6;ri2++){
        const ra=ri2*Math.PI/3;ctx.strokeStyle='rgba(195,185,170,0.18)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(ox2,oy2);ctx.lineTo(ox2+Math.cos(ra)*r*cr*4,oy2+Math.sin(ra)*r*cr*4);ctx.stroke();
      }
      ctx.strokeStyle='rgba(195,185,170,0.52)';ctx.lineWidth=r*cr*0.2;
      ctx.beginPath();ctx.arc(ox2,oy2,r*cr,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=RG(ox2,oy2,0,ox2,oy2,r*cr,0,'rgba(22,16,12,0.68)',1,'transparent');
      ctx.beginPath();ctx.arc(ox2,oy2,r*cr,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
    // Hard terminator
    ctx.fillStyle=LG(ppx-r,ppy,ppx+r,ppy,0,'transparent',0.44,'transparent',0.54,'rgba(0,0,0,0.45)',0.72,'rgba(0,0,0,0.88)',1,'rgba(0,0,0,0.98)');
    sphere();ctx.fill();

  }else if(sub==='venus'){
    // Thick atmosphere glow
    ctx.fillStyle=RG(ppx,ppy,r*0.85,ppx,ppy,r*1.65,0,'rgba(255,220,80,0.32)',0.45,'rgba(240,185,48,0.14)',1,'transparent');

    ctx.fillStyle=RG(ppx-r*0.2,ppy-r*0.2,r*0.05,ppx+r*0.1,ppy+r*0.1,r,
      0,'#e8d890',0.25,'#d8bc58',0.52,'#be9030',0.78,'#80540e',1,'#321e04');

    for(let bi=0;bi<7;bi++){

      ctx.save();ctx.translate(ppx,ppy);ctx.rotate(brot);
      ctx.fillStyle=`rgba(252,240,170,${0.12+bi*0.015})`;
      ctx.fillRect(-r,by*r,r*2,r*0.18);ctx.restore();
    }
    // Swirl patterns
    ctx.globalAlpha=0.18;
    for(let si=0;si<3;si++){
      const sx2=ppx+Math.cos(rot*0.04+si*2.1)*r*0.3,sy2=ppy+Math.sin(rot*0.04+si*2.1)*r*0.2;
      ctx.fillStyle=RG(sx2,sy2,0,sx2,sy2,r*0.28,0,'rgba(255,245,180,0.8)',1,'transparent');
      ctx.beginPath();ctx.ellipse(sx2,sy2,r*0.28,r*0.14,rot*0.04+si,0,Math.PI*2);ctx.fill();

    ctx.globalAlpha=1;
    ctx.restore();
    terminator(0.72);specular(-0.38,-0.42,0.58,0.5);

  }else if(sub==='moon'){
    ctx.fillStyle=RG(ppx-r*0.28,ppy-r*0.28,r*0.03,ppx+r*0.1,ppy+r*0.1,r,
      0,'#cac4bc',0.3,'#a09890',0.62,'#706862',0.85,'#423c36',1,'#1a1614');
    sphere();ctx.fill();
    clip();
    // Mare regions (dark basaltic plains)
    const mares=[{dx:0.15,dy:-0.22,rx:0.42,ry:0.3},{dx:0.35,dy:0.12,rx:0.25,ry:0.2},{dx:-0.08,dy:0.18,rx:0.2,ry:0.16}];
    mares.forEach(ma=>{
      ctx.fillStyle=RG(ppx+ma.dx*r,ppy+ma.dy*r,0,ppx+ma.dx*r,ppy+ma.dy*r,r*ma.rx,0,'rgba(48,42,38,0.72)',0.7,'rgba(62,55,48,0.5)',1,'transparent');
      ctx.beginPath();ctx.ellipse(ppx+ma.dx*r,ppy+ma.dy*r,r*ma.rx,r*ma.ry,rot*0.04,0,Math.PI*2);ctx.fill();
    });
    // Craters with rays
    [[0.3,0.25,0.12],[0.18,-0.4,0.1],[-0.3,0.3,0.11],[0.38,-0.15,0.09],[-0.12,-0.32,0.07],[0.05,0.4,0.08]].forEach(([dx,dy,cr])=>{
      const ox2=ppx+dx*r,oy2=ppy+dy*r;
      // Bright ejecta rays for large craters
      if(cr>0.09){

        for(let ri2=0;ri2<8;ri2++){
          const ra=ri2*Math.PI/4+cr*10;
          ctx.beginPath();ctx.moveTo(ox2,oy2);ctx.lineTo(ox2+Math.cos(ra)*r*cr*5,oy2+Math.sin(ra)*r*cr*5);ctx.stroke();

      }
      ctx.strokeStyle='rgba(205,198,188,0.55)';ctx.lineWidth=r*cr*0.2;
      ctx.beginPath();ctx.arc(ox2,oy2,r*cr,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=RG(ox2,oy2,0,ox2,oy2,r*cr,0,'rgba(18,14,12,0.72)',1,'transparent');
      ctx.beginPath();ctx.arc(ox2,oy2,r*cr,0,Math.PI*2);ctx.fill();
      // Central peak for large craters
      if(cr>0.08){
        ctx.fillStyle=`rgba(210,202,192,0.5)`;
        ctx.beginPath();ctx.arc(ox2,oy2,r*cr*0.18,0,Math.PI*2);ctx.fill();
      }
    });
    ctx.restore();
    ctx.fillStyle=LG(ppx-r,ppy,ppx+r,ppy,0,'transparent',0.44,'transparent',0.55,'rgba(0,0,0,0.3)',0.72,'rgba(0,0,0,0.72)',1,'rgba(0,0,0,0.92)');
    sphere();ctx.fill();
    specular(-0.33,-0.36,0.42,0.46);

  }else if(p.type==='red'){
    const flick=0.6+0.4*Math.sin(t*3.5+p.pulse);
    // Extended corona
    ctx.fillStyle=RG(ppx,ppy,r*0.82,ppx,ppy,r*3.2,0,`rgba(255,200,50,${0.38*flick})`,0.25,`rgba(255,140,20,${0.22*flick})`,0.55,`rgba(255,80,0,${0.1*flick})`,1,'transparent');
    ctx.beginPath();ctx.arc(ppx,ppy,r*3.2,0,Math.PI*2);ctx.fill();
    // Solar flares
    for(let f=0;f<4;f++){
      const fa=rot*0.35+f*Math.PI*0.5+Math.sin(t*0.8+f*1.6)*0.5;
      const fl=Math.max(r*0.08,r*(0.5+0.5*Math.sin(t*2.2+f*1.9+p.pulse)));
      const fx=ppx+Math.cos(fa)*(r+fl*0.1),fy=ppy+Math.sin(fa)*(r+fl*0.1);
      ctx.fillStyle=RG(fx,fy,0,fx,fy,fl,0,`rgba(255,230,80,${0.65*flick})`,0.35,`rgba(255,120,0,${0.35*flick})`,1,'transparent');
      ctx.beginPath();ctx.arc(fx,fy,fl,0,Math.PI*2);ctx.fill();
    }
    // Sphere
    ctx.fillStyle=RG(ppx-r*0.28,ppy-r*0.28,r*0.04,ppx+r*0.12,ppy+r*0.12,r,
      0,'#fffacc',0.1,'#ffee00',0.28,'#ffcc00',0.5,'#ff9900',0.72,'#ee4400',0.88,'#bb1500',1,'#550500');
    sphere();ctx.fill();
    clip();
    // Plasma convection cells
    for(let ci=0;ci<5;ci++){
      const cx2=ppx+(Math.cos(rot*0.3+ci*1.26)*0.5)*r;
      const cy2=ppy+(Math.sin(rot*0.3+ci*1.26)*0.3)*r;
      ctx.fillStyle=RG(cx2,cy2,0,cx2,cy2,r*0.22,0,`rgba(255,240,80,${0.35+0.15*flick})`,0.5,`rgba(255,160,0,0.2)`,1,'transparent');
      ctx.beginPath();ctx.arc(cx2,cy2,r*0.22,0,Math.PI*2);ctx.fill();
    }
    // Sunspots
    [{dx:0.28,dy:0.14,sr:0.12},{dx:-0.22,dy:-0.18,sr:0.09},{dx:0.1,dy:-0.3,sr:0.07}].forEach(s=>{
      const sx2=ppx+Math.cos(rot*0.28)*s.dx*r-Math.sin(rot*0.28)*s.dy*r;
      const sy2=ppy+Math.sin(rot*0.28)*s.dx*r+Math.cos(rot*0.28)*s.dy*r;
      ctx.fillStyle=RG(sx2,sy2,0,sx2,sy2,r*s.sr*1.8,0,'rgba(28,4,0,0.85)',0.5,'rgba(55,10,0,0.55)',1,'transparent');
      ctx.beginPath();ctx.arc(sx2,sy2,r*s.sr*1.8,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
    // Chromosphere
    ctx.fillStyle=RG(ppx,ppy,r*0.88,ppx,ppy,r*1.12,0,`rgba(255,180,0,${0.5+0.28*flick})`,1,'transparent');
    sphere();ctx.fill();
    specular(-0.3,-0.34,0.62,0.55);

  }else if(p.type==='black'){
    // Accretion disk — back
    ctx.save();ctx.translate(ppx,ppy);
    const diskGrad=ctx.createRadialGradient(0,0,r*1.05,0,0,r*2.35);
    diskGrad.addColorStop(0,'transparent');
    diskGrad.addColorStop(0.05,`rgba(255,165,0,0.82)`);
    diskGrad.addColorStop(0.22,`rgba(255,95,0,0.65)`);
    diskGrad.addColorStop(0.45,`rgba(200,40,0,0.42)`);
    diskGrad.addColorStop(0.7,`rgba(120,15,0,0.22)`);
    diskGrad.addColorStop(1,'transparent');
    ctx.fillStyle=diskGrad;
    ctx.beginPath();ctx.ellipse(0,0,r*2.35,r*2.35*0.22,rot*0.18,Math.PI,0);ctx.fill();
    // Disk shimmer
    ctx.fillStyle=`rgba(255,200,80,${0.12+0.08*Math.sin(t*2.5+p.pulse)})`;
    ctx.beginPath();ctx.ellipse(0,0,r*1.82,r*1.82*0.18,rot*0.18,Math.PI,0);ctx.fill();
    ctx.restore();
    // Photon sphere glow
    for(let gi=0;gi<3;gi++){
      ctx.strokeStyle=`rgba(${180+gi*30},${gi*40},${180+gi*20},${(0.28-gi*0.06)*(0.7+0.3*Math.sin(t*2+p.pulse))})`;
      ctx.lineWidth=r*(0.04-gi*0.01);
      ctx.beginPath();ctx.arc(ppx,ppy,r*(1.02+gi*0.05),0,Math.PI*2);ctx.stroke();
    }
    // Event horizon
    ctx.fillStyle=RG(ppx-r*0.08,ppy-r*0.08,0,ppx,ppy,r,0,'#0a0015',0.65,'#030008',1,'#000000');
    sphere();ctx.fill();
    // Gravitational lensing ring
    ctx.strokeStyle=`rgba(200,120,255,${0.55+0.2*Math.sin(t*2.2+p.pulse)})`;ctx.lineWidth=r*0.038;
    sphere();ctx.stroke();
    // Front accretion disk
    ctx.save();ctx.translate(ppx,ppy);ctx.fillStyle=diskGrad;
    ctx.beginPath();ctx.ellipse(0,0,r*2.35,r*2.35*0.22,rot*0.18,0,Math.PI);ctx.fill();
    ctx.fillStyle=`rgba(255,200,80,${0.12+0.08*Math.sin(t*2.5+p.pulse)})`;
    ctx.beginPath();ctx.ellipse(0,0,r*1.82,r*1.82*0.18,rot*0.18,0,Math.PI);ctx.fill();
    ctx.restore();
    // Gravity indicator
    if(p.gravR>0){ctx.strokeStyle='rgba(100,0,180,0.06)';ctx.lineWidth=1;ctx.setLineDash([5,12]);
      ctx.beginPath();ctx.arc(ppx,ppy,p.gravR,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
  }

  ctx.restore();
}

// Hex color to rgba helper — used by sampiyon ship
function hexA(hex,a){
  const h=(hex||'#000000').replace('#','');
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}

function drawShip(ctx,x,y,ang,shipId,col,S=16){
  const t=performance.now()*0.001; // seconds, for animations
  const T=Date.now()*0.001;
  const P=Math.sin(T*6)*0.5+0.5;   // fast pulse (engine)
  const P2=Math.sin(T*3.5+1)*0.5+0.5; // slow pulse (glow)
  const P3=Math.sin(T*9+0.5)*0.5+0.5; // flicker

  // helpers
  function G(x0,y0,x1,y1,...stops){
    const g=ctx.createLinearGradient(x0,y0,x1,y1);
    for(let i=0;i<stops.length;i+=2)g.addColorStop(stops[i],stops[i+1]);
    return g;
  }
  function RG(x0,y0,r0,x1,y1,r1,...stops){
    const r0s=Math.max(0,r0),r1s=Math.max(0.001,r1);
    const g=ctx.createRadialGradient(x0,y0,r0s,x1,y1,r1s);
    for(let i=0;i<stops.length;i+=2)g.addColorStop(stops[i],stops[i+1]);
    return g;
  }
  function poly(...pts){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();}
  // Multi-layer flame
  function flame(x0,y0,dx,dy,w,len,c1,c2,pulse){
    const fl=len*(0.6+pulse*0.4);
    const perp=Math.atan2(dy,dx)+Math.PI/2;
    const px=Math.cos(perp),py=Math.sin(perp);
    // Safe color with alpha — handle both hex and rgba
    function fadeCol(c,a){
      if(c.startsWith('#')&&c.length===7)return c+Math.round(a*255).toString(16).padStart(2,'0');
      if(c.startsWith('rgba'))return c.replace(/[\d.]+\)$/,v=>String(parseFloat(v)*a)+')');
      return c;
    }
    // outer glow
    ctx.fillStyle=G(x0,y0,x0+dx*fl,y0+dy*fl,0,fadeCol(c1,0.27),0.6,fadeCol(c2,0.13),1,'transparent');
    poly(x0+px*w*1.4,y0+py*w*1.4,x0+dx*fl*1.1,y0+dy*fl*1.1,x0-px*w*1.4,y0-py*w*1.4);ctx.fill();
    // core flame
    ctx.fillStyle=G(x0,y0,x0+dx*fl*0.9,y0+dy*fl*0.9,0,'#ffffff',0.15,c1,0.55,fadeCol(c2,0.67),1,'transparent');
    poly(x0+px*w,y0+py*w,x0+dx*fl*0.9,y0+dy*fl*0.9,x0-px*w,y0-py*w);ctx.fill();
    // hot core
    ctx.fillStyle=G(x0,y0,x0+dx*fl*0.3,y0+dy*fl*0.3,0,'#ffffff',1,'rgba(255,255,255,0.0)');
    poly(x0+px*w*0.3,y0+py*w*0.3,x0+dx*fl*0.3,y0+dy*fl*0.3,x0-px*w*0.3,y0-py*w*0.3);ctx.fill();
  }
  // Engine nozzle bell
  function nozzle(cx2,cy2,rOuter,rInner,len,flameCol,pulse){
    // Bell shape
    const bg=G(cx2-rOuter,cy2,cx2+rOuter,cy2,0,'#3a4455',0.5,'#5a6677',1,'#3a4455');
    ctx.fillStyle=bg;
    ctx.beginPath();ctx.arc(cx2,cy2,rOuter,0,Math.PI*2);ctx.fill();
    // Cooling rings
    for(let r2=0;r2<3;r2++){
      const ry=rOuter*(0.35+r2*0.22);
      ctx.strokeStyle='#2a3344';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(cx2,cy2,ry,0,Math.PI*2);ctx.stroke();
    }
    // Inner throat glow
    ctx.fillStyle=RG(cx2,cy2,0,cx2,cy2,rInner,0,flameCol+'ff',0.4,flameCol+'88',1,'rgba(0,0,0,0.0)');
    ctx.beginPath();ctx.arc(cx2,cy2,rInner,0,Math.PI*2);ctx.fill();
    // Hot core
    const core=Math.max(0.001,rInner*0.4*(0.6+pulse*0.4));
    ctx.fillStyle=RG(cx2,cy2,0,cx2,cy2,core,0,'#ffffff',0.5,flameCol,1,'transparent');
    ctx.beginPath();ctx.arc(cx2,cy2,core,0,Math.PI*2);ctx.fill();
    // Exhaust streak inside bell
    ctx.fillStyle=G(cx2,cy2,cx2+len,cy2,0,flameCol+'cc',0.3,'rgba(255,255,255,0.33)',0.7,flameCol+'44',1,'transparent');
    ctx.fillRect(cx2,cy2-rInner*0.5,len,rInner);
  }
  // Panel rivets
  function rivets(pts,r2=1.2,col='#778899'){
    ctx.fillStyle=col;
    for(let i=0;i<pts.length;i+=2){ctx.beginPath();ctx.arc(pts[i],pts[i+1],r2,0,Math.PI*2);ctx.fill();}
  }
  // Cockpit glass multi-layer
  function cockpit(cx2,cy2,rw,rh,ang2=0,tint='#2266aa'){
    // Frame
    ctx.fillStyle=G(-rw,-rh,rw,rh,0,'#445566',1,'#223344');
    ctx.beginPath();ctx.ellipse(cx2,cy2,rw+2,rh+2,ang2,0,Math.PI*2);ctx.fill();
    // Dark interior
    ctx.fillStyle=tint+'dd';
    ctx.beginPath();ctx.ellipse(cx2,cy2,rw,rh,ang2,0,Math.PI*2);ctx.fill();
    // HUD glow

      if(Math.abs(sx3-s*8)>s*5||Math.abs(sy3)>s*2.8)continue;
      ctx.fillStyle=`rgba(220,180,255,${0.3+0.25*Math.sin(t*4+si3)})`;
      ctx.beginPath();ctx.arc(sx3,sy3,s*0.15,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();

    // Dimensional scan line
    const vscan2=((t*0.55)%1)*s*10-s*5;
    ctx.fillStyle=`rgba(180,0,255,${0.35+0.18*P})`;ctx.fillRect(s*8+vscan2-s*0.18,-s*2.6,s*0.36,s*5.2);
    // HUD reticle
    ctx.strokeStyle=`rgba(200,60,255,${0.2+0.12*Math.sin(t*2.5)})`;ctx.lineWidth=0.7;
    ctx.beginPath();ctx.arc(s*8,0,s*1.5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*6.5,0);ctx.lineTo(s*9.5,0);ctx.moveTo(s*8,-s*1.5);ctx.lineTo(s*8,s*1.5);ctx.stroke();

    // Outer rim
    ctx.strokeStyle=`rgba(180,0,255,${0.65+0.28*P})`;ctx.lineWidth=1.6;
    
    ctx.beginPath();ctx.ellipse(s*8,0,s*5.2,s*2.8,0,0,Math.PI*2);ctx.stroke();
    
    // Second rim ring
    ctx.strokeStyle=`rgba(140,0,200,${0.3+0.15*P2})`;ctx.lineWidth=0.8;
    ctx.beginPath();ctx.ellipse(s*8,0,s*5.8,s*3.2,0,0,Math.PI*2);ctx.stroke();

    // ── Void aura ─────────────────────────────────────────────
    ctx.fillStyle=RG(s*5,0,s*4,s*5,0,s*28,0,'transparent',0.4,'rgba(80,0,160,0.06)',0.7,'rgba(100,0,180,0.04)',1,'rgba(120,0,200,0.1)');
    ctx.beginPath();ctx.arc(s*5,0,s*28,0,Math.PI*2);ctx.fill();

  } else if(shipId==='sampiyon'){
    const s=sc*8/7.5;
    // ══════════════════════════════════════════════════════════
    // ŞAMPİYON — Halka Gemisi
    // Yan yana 5 halka, aralarında enerji köprüleri.
    // Hiçbir gemiye benzemeyen özgün konsept.
    // ══════════════════════════════════════════════════════════

    // Ring positions along X axis
    const rings=[
      {x:-s*8, ry:s*6, rz:s*2.2, col:'#00ffcc', w:s*1.4},
      {x:-s*2, ry:s*8, rz:s*2.8, col:'#00ddff', w:s*1.6},
      {x:s*5,  ry:s*9, rz:s*3,   col:'#44ccff', w:s*1.8},
      {x:s*12, ry:s*8, rz:s*2.8, col:'#00ddff', w:s*1.6},
      {x:s*18, ry:s*6, rz:s*2.2, col:'#00ffcc', w:s*1.4},
    ];

    // ── Engine ────────────────────────────────────────────────
    flame(-s*11,0,-1,0,s*2.8,s*28,'#00ffee','#0055aa',P2);
    flame(-s*11,0,-1,0,s*1.2,s*20,'#ffffff','#44ffee',P);
    flame(-s*11,0,-1,0,s*0.5,s*14,'#ffffff','#ffffff',P3);
    for(const sv of[-1,1]){
      flame(-s*10,sv*s*2,-1,0,s*1,s*12,'#00eedd','#003366',sv>0?P:P2);
    }

    // ── Particle trails ───────────────────────────────────────
    for(let pi=0;pi<8;pi++){
      const pp=(t*2+pi*0.14)%1;
      const px=-s*11-pp*s*20;
      const py=Math.sin(t*5+pi*0.9)*s*2.5*(1-pp);
      ctx.fillStyle=`rgba(0,255,200,${(1-pp)*0.4})`;
      ctx.beginPath();ctx.arc(px,py,s*(0.9-pp*0.7),0,Math.PI*2);ctx.fill();
    }

    // ── Central spine through all rings ──────────────────────
    ctx.fillStyle=G(-s*10,0,s*20,0,0,'rgba(0,80,100,0.9)',0.4,'rgba(0,120,140,0.85)',0.6,'rgba(0,120,140,0.85)',1,'rgba(0,60,80,0.9)');
    ctx.fillRect(-s*10,-s*1,s*32,s*2);
    // Spine glow line
    const sg=ctx.createLinearGradient(-s*10,0,s*22,0);
    sg.addColorStop(0,'transparent');sg.addColorStop(0.05,`rgba(0,255,200,${0.3+0.15*P2})`);
    sg.addColorStop(0.5,`rgba(0,255,220,${0.55+0.28*P})`);sg.addColorStop(0.95,`rgba(0,255,200,${0.3+0.15*P2})`);sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.fillRect(-s*10,-s*0.4,s*32,s*0.8);

    // ── Energy arcs between adjacent rings ────────────────────
    for(let i=0;i<rings.length-1;i++){
      const r1=rings[i],r2=rings[i+1];
      const mid=(r1.x+r2.x)/2;
      // Top arc
      for(const sv of[-1,1]){
        const ag=0.4+0.35*Math.sin(t*4+i*0.9+sv*1.5);
        ctx.strokeStyle=`rgba(0,255,200,${ag})`;ctx.lineWidth=1.4;
        ctx.beginPath();
        ctx.moveTo(r1.x,sv*r1.ry*0.85);
        ctx.bezierCurveTo(mid,sv*(r1.ry+r2.ry)*0.6,mid,sv*(r1.ry+r2.ry)*0.6,r2.x,sv*r2.ry*0.85);
        ctx.stroke();
        // Inner arc (dimmer)
        ctx.strokeStyle=`rgba(100,255,220,${ag*0.4})`;ctx.lineWidth=0.6;
        ctx.beginPath();
        ctx.moveTo(r1.x,sv*r1.ry*0.5);
        ctx.bezierCurveTo(mid,sv*(r1.ry+r2.ry)*0.35,mid,sv*(r1.ry+r2.ry)*0.35,r2.x,sv*r2.ry*0.5);
        ctx.stroke();
      }
      // Energy spark traveling between rings
      const sp2=(t*2.5+i*0.5)%1;
      const spx=r1.x+(r2.x-r1.x)*sp2;
      const spy=(sv=>sv*(r1.ry+(r2.ry-r1.ry)*sp2)*0.85)(Math.sin(t*3+i)>0?1:-1);
      ctx.fillStyle=`rgba(180,255,230,${0.8*(1-Math.abs(sp2-0.5)*2)+0.2})`;
      ctx.beginPath();ctx.arc(spx,spy,s*0.65,0,Math.PI*2);ctx.fill();
    }

    // ── Draw each ring ────────────────────────────────────────
    rings.forEach((r,ri)=>{
      const pulse=0.85+0.12*Math.sin(t*3+ri*0.7);
      const ry2=r.ry*pulse,rz2=r.rz*pulse;

      // Back half of ring (drawn first)
      ctx.strokeStyle=`rgba(0,40,55,0.8)`;ctx.lineWidth=r.w*1.1;
      ctx.beginPath();ctx.ellipse(r.x,0,ry2,rz2,0,0,Math.PI);ctx.stroke();

      // Ring body — back half
      ctx.strokeStyle=G(-ry2,0,ry2,0,0,'rgba(0,80,100,0.9)',0.4,hexA(r.col,0.8),0.6,hexA(r.col,0.8),1,'rgba(0,80,100,0.9)');
      ctx.lineWidth=r.w;
      ctx.beginPath();ctx.ellipse(r.x,0,ry2,rz2,0,0,Math.PI);ctx.stroke();

      // Ring inner glow back
      ctx.strokeStyle=`rgba(0,255,200,${0.15+0.1*pulse})`;ctx.lineWidth=r.w*0.35;
      ctx.beginPath();ctx.ellipse(r.x,0,ry2*0.88,rz2*0.88,0,0,Math.PI);ctx.stroke();

      // Ring detail — panel marks
      for(let d=0;d<6;d++){
        const da=d*Math.PI/6+t*0.05*(ri%2?1:-1);
        const dx1=Math.cos(da)*ry2*0.82,dy1=Math.sin(da)*rz2*0.82;
        const dx2=Math.cos(da)*ry2*1.05,dy2=Math.sin(da)*rz2*1.05;
        if(dy1<0||dy2<0)continue; // back half only
        const dg=0.25+0.15*Math.sin(t*2+d+ri);
        ctx.strokeStyle=`rgba(0,255,200,${dg})`;ctx.lineWidth=0.8;
        ctx.beginPath();ctx.moveTo(r.x+dx1,dy1);ctx.lineTo(r.x+dx2,dy2);ctx.stroke();
      }
    });

    // ── Nose cone ────────────────────────────────────────────
    ctx.fillStyle=G(s*18,-s*1,s*26,s*1,0,'rgba(0,220,200,0.9)',0.4,'rgba(0,160,170,0.85)',1,'rgba(0,60,80,0.9)');
    poly(s*18,-s*4.5,s*26,0,s*18,s*4.5);ctx.fill();
    ctx.fillStyle='rgba(150,255,230,0.18)';poly(s*18,-s*4.5,s*26,0,s*22,-s*1.5,s*20,-s*3.5);ctx.fill();
    ctx.strokeStyle=`rgba(0,255,210,0.5)`;ctx.lineWidth=0.9;
    ctx.beginPath();ctx.moveTo(s*20,-s*3);ctx.lineTo(s*25,0);ctx.lineTo(s*20,s*3);ctx.stroke();
    // Tip glow
    ctx.fillStyle=RG(s*25,0,0,s*25,0,s*3,0,`rgba(180,255,240,${0.9+0.08*P3})`,0.4,'rgba(0,220,200,0.55)',1,'transparent');
    ctx.beginPath();ctx.arc(s*26,0,s*2.5,0,Math.PI*2);ctx.fill();
    for(let ri=0;ri<3;ri++){
      const rp=(t*3+ri*0.33)%1;const rrr=s*(2.2-rp*2.2);if(rrr<0.1)continue;
      ctx.strokeStyle=`rgba(0,255,200,${rp*(1-rp)*3*0.5})`;ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(s*26,0,rrr,0,Math.PI*2);ctx.stroke();
    }
    ctx.strokeStyle='rgba(100,255,220,0.6)';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(s*26,0);ctx.lineTo(s*31,0);ctx.stroke();
    ctx.fillStyle=`rgba(150,255,230,${0.7+0.2*P3})`;ctx.beginPath();ctx.arc(s*31,0,s*0.8,0,Math.PI*2);ctx.fill();

    // ── Draw front halves of rings (over nose/spine) ──────────
    rings.forEach((r,ri)=>{
      const pulse=0.85+0.12*Math.sin(t*3+ri*0.7);
      const ry2=r.ry*pulse,rz2=r.rz*pulse;

      // Ring body front half
      const rg=ctx.createLinearGradient(r.x-ry2,0,r.x+ry2,0);
      rg.addColorStop(0,'rgba(0,100,120,0.9)');rg.addColorStop(0.25,hexA(r.col,0.8));rg.addColorStop(0.5,hexA(r.col,1));rg.addColorStop(0.75,hexA(r.col,0.8));rg.addColorStop(1,'rgba(0,100,120,0.9)');
      ctx.strokeStyle=rg;ctx.lineWidth=r.w;
      ctx.beginPath();ctx.ellipse(r.x,0,ry2,rz2,0,Math.PI,0);ctx.stroke();

      // Inner highlight front
      ctx.strokeStyle=`rgba(200,255,240,${0.35+0.2*pulse})`;ctx.lineWidth=r.w*0.28;
      ctx.beginPath();ctx.ellipse(r.x,0,ry2*0.88,rz2*0.88,0,Math.PI,0);ctx.stroke();

      // Outer edge glow front
      ctx.strokeStyle=`rgba(0,255,200,${0.2+0.12*pulse})`;ctx.lineWidth=r.w*0.18;
      ctx.beginPath();ctx.ellipse(r.x,0,ry2*1.06,rz2*1.06,0,Math.PI,0);ctx.stroke();

      // Detail marks front
      for(let d=0;d<6;d++){
        const da=d*Math.PI/6+t*0.05*(ri%2?1:-1);
        const dx1=Math.cos(da)*ry2*0.82,dy1=Math.sin(da)*rz2*0.82;
        const dx2=Math.cos(da)*ry2*1.06,dy2=Math.sin(da)*rz2*1.06;
        if(dy1>0||dy2>0)continue; // front half
        const dg=0.3+0.18*Math.sin(t*2+d+ri);
        ctx.strokeStyle=`rgba(150,255,230,${dg})`;ctx.lineWidth=0.9;
        ctx.beginPath();ctx.moveTo(r.x+dx1,dy1);ctx.lineTo(r.x+dx2,dy2);ctx.stroke();
      }

      // Ring center hub
      ctx.fillStyle=RG(r.x,0,0,r.x,0,s*1.2,0,`rgba(0,255,200,${0.6+0.25*Math.sin(t*4+ri)})`,0.6,'rgba(0,150,160,0.3)',1,'transparent');
      ctx.beginPath();ctx.arc(r.x,0,s*1.2,0,Math.PI*2);ctx.fill();
    });

    // ── Cockpit: integrated into front ring ───────────────────
    const cr=rings[4];
    ctx.fillStyle='rgba(0,15,25,0.96)';ctx.beginPath();ctx.ellipse(cr.x,0,cr.ry*0.62,cr.rz*0.62,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(0,180,160,${0.1+0.06*P2})`;ctx.beginPath();ctx.ellipse(cr.x,0,cr.ry*0.62,cr.rz*0.62,0,0,Math.PI*2);ctx.fill();
    // HUD grid
    ctx.strokeStyle=`rgba(0,200,170,${0.18+0.1*Math.sin(t*2)})`;ctx.lineWidth=0.5;
    for(let gi=-1;gi<=1;gi++){ctx.beginPath();ctx.moveTo(cr.x+gi*cr.ry*0.3,-cr.rz*0.55);ctx.lineTo(cr.x+gi*cr.ry*0.3,cr.rz*0.55);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(cr.x-cr.ry*0.55,0);ctx.lineTo(cr.x+cr.ry*0.55,0);ctx.stroke();
    // Reticle
    ctx.strokeStyle=`rgba(80,255,200,${0.3+0.15*P})`;ctx.lineWidth=0.8;
    ctx.beginPath();ctx.arc(cr.x,0,cr.rz*0.28,0,Math.PI*2);ctx.stroke();
    // Highlight
    ctx.fillStyle=RG(cr.x-cr.ry*0.25,-cr.rz*0.35,0,cr.x-cr.ry*0.1,-cr.rz*0.1,cr.rz*0.38,0,'rgba(180,255,240,0.4)',1,'transparent');
    ctx.beginPath();ctx.ellipse(cr.x,0,cr.ry*0.62,cr.rz*0.62,0,0,Math.PI*2);ctx.fill();

    // ── Aura ─────────────────────────────────────────────────
    ctx.fillStyle=RG(s*5,0,s*3,s*5,0,s*24,0,'transparent',0.5,'rgba(0,200,170,0.05)',1,'rgba(0,180,160,0.08)');
    ctx.beginPath();ctx.arc(s*5,0,s*24,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}
const GAME_ZOOM=0.9; // v2.2 — 10% zoom out — see more of the world

function draw(ts){
  cx.clearRect(0,0,W,H);uiZones=[];
  const t=ts*0.001;
  // Smooth shop scroll
  if(phase==='SHOP')shopScroll+=(shopScrollTarget-shopScroll)*0.18;
  if(phase==='SHOP'||phase==='LEADERBOARD'){if(phase==='SHOP')drawShop(t,ts);else drawLeaderboard(t);return;}

  const z=getZone(scoreKm);

  // ── Background (full screen, pure black space) ────────────────────────────
  cx.fillStyle='#000005';cx.fillRect(0,0,W,H);
  // Zone color tint (subtle)
  const zoneTint=cx.createLinearGradient(0,0,0,H*0.5);
  zoneTint.addColorStop(0,bgCol+'44');zoneTint.addColorStop(1,'transparent');
  cx.fillStyle=zoneTint;cx.fillRect(0,0,W,H);


  // ── Stars & Constellations ────────────────────────────────────────────────
  const camPX=cam.x||0, camPY=cam.y||0;

  for(const s of STARS){
    // Simple: fixed screen position shifted slightly by camera (parallax)
    let px = (s.nx * W - camPX * s.spd * 0.05 % W + W*2) % W;
    let py = (s.ny * H - camPY * s.spd * 0.05 % H + H*2) % H;
    const twk = s.alpha * (0.7 + 0.3 * Math.sin(t * 0.4 + s.twk));
    cx.globalAlpha = twk;
    cx.fillStyle = s.col;
    if(s.bright){
      cx.beginPath(); cx.arc(px, py, s.sz, 0, Math.PI*2); cx.fill();
      cx.globalAlpha = twk * 0.25;
      cx.fillRect(px - s.sz*3, py - 0.3, s.sz*6, 0.6);
      cx.fillRect(px - 0.3, py - s.sz*3, 0.6, s.sz*6);
    } else if(s.medium){
      cx.beginPath(); cx.arc(px, py, s.sz, 0, Math.PI*2); cx.fill();
    } else {
      cx.fillRect(px, py, s.sz, s.sz);
    }
  }
  cx.globalAlpha = 1;

  for(const con of CONSTS){
    const ox = (con.ax * W - camPX * con.spd * 0.03 % W + W*2) % W;
    const oy = (con.ay * H - camPY * con.spd * 0.03 % H + H*2) % H;
    const c2 = Math.cos(con.rot), s2 = Math.sin(con.rot), sc = con.sc;
    const pts = con.pts.map(([x,y]) => {
      const rx=x*sc, ry=y*sc;
      return [ox + rx*c2 - ry*s2, oy + rx*s2 + ry*c2];
    });
    cx.strokeStyle = 'rgba(140,170,230,0.18)'; cx.lineWidth = 0.8;
    for(let i=0; i<pts.length-1; i++){
      const [x0,y0]=pts[i], [x1,y1]=pts[i+1];
      if(Math.abs(x1-x0)>W*0.5 || Math.abs(y1-y0)>H*0.5) continue;
      cx.beginPath(); cx.moveTo(x0,y0); cx.lineTo(x1,y1); cx.stroke();
    }
    for(let i=0; i<pts.length; i++){
      const [x,y] = pts[i];
      if(x<-20||x>W+20||y<-20||y>H+20) continue;
      cx.fillStyle = '#c0d4f0';
      cx.globalAlpha = i===0 ? 0.6 : 0.38;
      cx.beginPath(); cx.arc(x, y, i===0?1.5:1.0, 0, Math.PI*2); cx.fill();
    }
  }
  cx.globalAlpha = 1;

  // ── If paused — skip game world, just show pause screen ──────────────────
  if(paused){
    drawPause(t);
    if(howToOpen)drawHowTo();
    cx.restore();
    return;
  }

  // ── Game world (zoomed out 10%) — only during gameplay ───────────────────
  const isPlaying=phase==='FLYING'||phase==='ORBITING';
  if(isPlaying){
  cx.save();
  cx.translate(W/2,H/2);cx.scale(GAME_ZOOM,GAME_ZOOM);cx.translate(-W/2,-H/2);

  if(holding&&phase==='FLYING'){
    for(const p of planets){
      const dd=d2(probe.x,probe.y,p.x,p.y);
      if(dd<ROPE_LEN&&dd>p.r+PROBE_R*2){
        const ppx=sx(p.x),ppy=sy(p.y);
        cx.globalAlpha=(1-dd/ROPE_LEN)*0.5;
        const hintCol=p.type==='red'?'#ffaa00':p.type==='black'?'#aa44ff':
          p.subtype==='earth'?'#44aaff':p.subtype==='mars'?'#ff6633':
          p.subtype==='jupiter'?'#ddaa55':p.subtype==='saturn'?'#ddcc88':
          p.subtype==='uranus'?'#44ddcc':p.subtype==='venus'?'#ffdd44':
          p.subtype==='mercury'?'#aabb99':p.subtype==='neptune'?'#4466ff':p.subtype==='moon'?'#ccccbb':'#aaddff';
        cx.strokeStyle=hintCol;cx.lineWidth=1;cx.setLineDash([3,5]);
        cx.beginPath();cx.arc(ppx,ppy,p.r+16,0,Math.PI*2);cx.stroke();
        cx.setLineDash([]);cx.globalAlpha=1;
      }
    }
  }

  // Planets — use offscreen cache for performance
  for(const p of planets){
    const ppx=pxr(sx(p.x)),ppy=pxr(sy(p.y));
    if(ppx<-p.r*6||ppx>W+p.r*6||ppy<-p.r*6||ppy>H+p.r*6)continue;
    try{
      const cached=_getCachedPlanet(p,t);
      cx.drawImage(cached.canvas, ppx-cached.pad, ppy-cached.pad);
      // Draw movers (can't be in offscreen cache - use world coords)
      for(const mv of p.movers){
        const mx2=pxr(sx(mv.x)),my2=pxr(sy(mv.y)),sz2=mv.sz;
        cx.save();cx.translate(mx2,my2);cx.rotate(mv.ang||0);
        // Rocky irregular shape — 8 vertices with noise
        const verts=mv.verts||(()=>{
          const v=[];for(let i=0;i<8;i++){const a=i*Math.PI/4,r2=0.7+Math.random()*0.55;v.push({a,r:r2});}
          mv.verts=v;return v;
        })();
        // Shadow side
        const ag=cx.createRadialGradient(-sz2*0.35,-sz2*0.35,sz2*0.1,0,0,sz2*1.3);
        ag.addColorStop(0,'#d4c8a8');ag.addColorStop(0.3,'#a08868');ag.addColorStop(0.65,'#604838');ag.addColorStop(1,'#1a0e08');
        cx.fillStyle=ag;
        cx.beginPath();
        verts.forEach((v,i)=>{
          const x2=Math.cos(v.a)*sz2*v.r,y2=Math.sin(v.a)*sz2*v.r;
          i===0?cx.moveTo(x2,y2):cx.lineTo(x2,y2);
        });
        cx.closePath();cx.fill();
        // Surface cracks
        cx.strokeStyle='rgba(20,10,5,0.35)';cx.lineWidth=0.7;
        cx.beginPath();cx.moveTo(-sz2*0.1,-sz2*0.6);cx.lineTo(sz2*0.3,sz2*0.1);cx.lineTo(-sz2*0.2,sz2*0.5);cx.stroke();
        cx.beginPath();cx.moveTo(sz2*0.5,-sz2*0.2);cx.lineTo(sz2*0.1,sz2*0.4);cx.stroke();
        // Highlight
        cx.fillStyle='rgba(220,205,175,0.18)';
        cx.beginPath();cx.ellipse(-sz2*0.2,-sz2*0.25,sz2*0.35,sz2*0.22,Math.PI*0.3,0,Math.PI*2);cx.fill();
        // Rim
        cx.strokeStyle='rgba(80,55,35,0.5)';cx.lineWidth=0.8;
        cx.beginPath();
        verts.forEach((v,i)=>{
          const x2=Math.cos(v.a)*sz2*v.r,y2=Math.sin(v.a)*sz2*v.r;
          i===0?cx.moveTo(x2,y2):cx.lineTo(x2,y2);
        });
        cx.closePath();cx.stroke();
        cx.restore();
      }
    }catch(e){
      try{drawPlanet(p,ppx,ppy,t,cx);}catch(e2){console.error('drawPlanet error:',p.subtype||p.type,e2.message);}
    }
  }

  // Trail (pixel squares, color per trail)
  const _tc=trailCol(t);
  function drawTrailArr(arr){
    if(arr.length<2)return;
    // Draw as a single path per alpha band for perf
    const len=arr.length;
    for(let i=1;i<len;i++){
      const ratio=i/len;
      cx.globalAlpha=ratio*0.7;
      cx.fillStyle=_tc;
      const px2=pxr(sx(arr[i].x)),py2=pxr(sy(arr[i].y));
      cx.fillRect(px2,py2,2,2);
    }
    cx.globalAlpha=1;
  }
  drawTrailArr(probe.trail);
  if(probe.trail2.length>0)drawTrailArr(probe.trail2);
  if(probe.trail3.length>0)drawTrailArr(probe.trail3);
  if(probe.trail4.length>0)drawTrailArr(probe.trail4);

  // Rope/tether (dashed pixel beam)
  if(orb){
    const rx0=pxr(sx(probe.x)),ry0=pxr(sy(probe.y));
    const rx1=pxr(sx(orb.planet.x)),ry1=pxr(sy(orb.planet.y));
    const hcol=orb.heat>0?`hsl(${(1-orb.heat)*110},100%,58%)`:trailCol(t);
    cx.strokeStyle=hcol;cx.lineWidth=2;cx.globalAlpha=0.9;cx.setLineDash([4,3]);
    cx.beginPath();cx.moveTo(rx0,ry0);cx.lineTo(rx1,ry1);cx.stroke();
    cx.setLineDash([]);cx.globalAlpha=1;
    cx.fillStyle='#ffffff';cx.fillRect(rx0-1,ry0-1,2,2);// joint pixel
  }

  // Hearts in world — smooth high quality
  for(const h of hearts){
    const wx=h.planet?h.planet.x+Math.cos(h.ang)*h.orbitR:h.floatX;
    const wy=h.planet?h.planet.y+Math.sin(h.ang)*h.orbitR:h.floatY;
    const hx=pxr(sx(wx));
    const hy=pxr(sy(wy));
    const pulse2=0.9+0.1*Math.sin(h.pulse);
    const hs=18*pulse2;
    cx.save();cx.translate(hx,hy);
    // Outer glow
    const hg=cx.createRadialGradient(0,0,0,0,0,hs*2.5);
    hg.addColorStop(0,'rgba(255,50,100,0.35)');
    hg.addColorStop(0.5,'rgba(255,20,80,0.12)');
    hg.addColorStop(1,'transparent');
    cx.fillStyle=hg;cx.beginPath();cx.arc(0,0,hs*2.5,0,Math.PI*2);cx.fill();
    // Shadow glow — use gradient instead of shadowBlur (better perf)
    cx.strokeStyle='rgba(255,30,80,0.5)';cx.lineWidth=2;
    // Heart path — proper two-lobe shape
    function heartPath(sz){
      cx.beginPath();
      cx.moveTo(0,sz*0.3);
      cx.bezierCurveTo(sz*0.1,sz*0.1,sz*1.0,-sz*0.15,sz*1.0,-sz*0.55);
      cx.bezierCurveTo(sz*1.0,-sz*1.1,sz*0.35,-sz*1.2,0,-sz*0.8);
      cx.bezierCurveTo(-sz*0.35,-sz*1.2,-sz*1.0,-sz*1.1,-sz*1.0,-sz*0.55);
      cx.bezierCurveTo(-sz*1.0,-sz*0.15,-sz*0.1,sz*0.1,0,sz*0.3);
      cx.closePath();
    }
    cx.fillStyle='#ff1a4d';
    heartPath(hs);cx.fill();
    // Inner gradient
    const ig=cx.createRadialGradient(-hs*0.25,-hs*0.5,0,-hs*0.1,-hs*0.3,hs*0.95);
    ig.addColorStop(0,'rgba(255,150,170,0.55)');
    ig.addColorStop(0.6,'rgba(220,40,80,0.2)');
    ig.addColorStop(1,'rgba(180,0,40,0.0)');
    cx.fillStyle=ig;
    heartPath(hs);cx.fill();
    // Specular highlight
    cx.fillStyle='rgba(255,200,215,0.5)';
    cx.beginPath();cx.ellipse(-hs*0.3,-hs*0.55,hs*0.28,hs*0.17,-0.4,0,Math.PI*2);cx.fill();
    cx.restore();
  }

  // Sparks
  for(const s of sparks){
    cx.fillStyle=s.col;cx.globalAlpha=s.life;
    cx.fillRect(pxr(sx(s.x)),pxr(sy(s.y)),s.sz,s.sz);
    cx.globalAlpha=1;
  }

  // Ship
  if(phase!=='MENU'){
    const tc=trailCol(t);
    const _shipS=(selShipDef().S)||2.5;
    drawShip(cx,sx(probe.x),sy(probe.y),probe.ang,selShip,tc,_shipS);
    // Orbit indicators (spin bar, heat, black hole grace)
    if(phase==="ORBITING"&&orb){
      const ppx=Math.round(sx(probe.x)),ppy=Math.round(sy(probe.y));
      const bw2=64,bh2=8,bx2=ppx-bw2/2,bby=ppy-46;
      if(orb.planet.type==="red"&&orb.heat>0){
        const hcol=`hsl(${(1-orb.heat)*100},100%,55%)`;
        progressBar(bx2,bby,bw2,bh2,orb.heat,hcol,'rgba(60,0,0,0.7)');
        glowText(T_.solarHeat,ppx,bby-4,hcol,8,6);
      }
      if(orb.planet.type!=="black"&&(orb.spinMult||1)>1.05){
        const prog=Math.min(1,((orb.spinMult||1)-1)/(MAX_SPIN_MULT-1));
        const barCol=`hsl(${(1-prog)*120},100%,55%)`;
        progressBar(bx2,bby,bw2,bh2,prog,barCol,'rgba(0,10,30,0.7)');
        glowText(`×${(orb.spinMult||1).toFixed(1)} HIZ`,ppx,bby-4,barCol,8,6);
      }
      if(orb.planet.type==="black"){
        if((orb.graceTime||0)>0){
          const gp2=(orb.graceTime||0)/1.8;
          const gc=gp2>0.4?"#cc44ff":"#ff2244";
          progressBar(bx2,bby,bw2,bh2,gp2,gc,'rgba(20,0,40,0.7)');
          glowText('HEMEN KAÇ!',ppx,bby-4,gc,8,8);
        } else {
          const pulse3=0.65+0.35*Math.sin(t*10);
          glowText(T_.beingPulled,ppx,bby,`rgba(255,40,40,${pulse3})`,9,12);
        }
      }
    }
  }

  cx.restore(); // end game world zoom
  } // end isPlaying

  drawHUD(t,z);

  if(flashAlpha>0){cx.globalAlpha=flashAlpha*0.65;cx.fillStyle=flashCol;cx.fillRect(0,0,W,H);cx.globalAlpha=1;}
  if(announce.on&&announce.zone)drawAnnounce();
  if(phase==='MENU')drawMenu(t,ts);
  if(tutorialStep>=0)drawTutorial(t);
  if(streakMsg>0)drawStreakMsg(t);
  if(howToOpen)drawHowTo();
  if(phase==='DEAD')drawDead(t);
}

// Rounded rect path (safe)
function rr(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  if(r<=0){cx.beginPath();cx.rect(x,y,w,h);return;}
  cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r);cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h);cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r);cx.arcTo(x,y,x+r,y,r);cx.closePath();
}
// Safe alpha variant of any color string
function colA(col,a){
  try{
    if(col.startsWith('#')&&col.length===7){
      const n=parseInt(col.slice(1),16);
      return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
    }
    if(col.startsWith('rgba')){return col.replace(/,\s*[\d.]+\s*\)/,`,${a})`);}
    if(col.startsWith('rgb(')){return col.replace('rgb(','rgba(').replace(')',`,${a})`);}
    if(col.startsWith('hsl(')){return col.replace('hsl(','hsla(').replace(')',`,${a})`);}
    if(col.startsWith('hsla')){return col.replace(/,\s*[\d.]+\s*\)/,`,${a})`);}
  }catch(e){}
  return col;
}

// Crisp text with glow
function ptxt(text,x,y,col,size,stroke,align='center'){
  cx.save();
  cx.font=`bold ${size}px Arial`;cx.textAlign=align;cx.textBaseline='alphabetic';
  if(stroke){cx.strokeStyle=stroke;cx.lineWidth=size*0.28;cx.lineJoin='round';cx.strokeText(text,x,y);}
  cx.fillStyle=col;cx.fillText(text,x,y);
  cx.restore();
}

function glowText(text,x,y,col,size,blur=18,align='center'){
  cx.save();
  cx.font=`bold ${size}px Arial`;cx.textAlign=align;cx.textBaseline='alphabetic';
  
  cx.fillStyle=col;cx.fillText(text,x,y);
  cx.shadowBlur=0;cx.fillText(text,x,y);
  cx.restore();
}

// Glass panel
function glassPanel(x,y,w,h,r=16,accentCol='rgba(80,160,255,0.35)',alpha=0.88){
  cx.save();
  // Backdrop fill
  rr(x,y,w,h,r);
  const bg=cx.createLinearGradient(x,y,x,y+h);
  bg.addColorStop(0,`rgba(14,10,28,${alpha})`);
  bg.addColorStop(1,`rgba(6,4,16,${alpha*1.05})`);
  cx.fillStyle=bg;cx.fill();
  // Inner top highlight
  rr(x+1,y+1,w-2,h*0.4,r);
  cx.fillStyle='rgba(255,255,255,0.04)';cx.fill();
  // Border glow
  
  cx.strokeStyle=accentCol;cx.lineWidth=1.2;
  rr(x,y,w,h,r);cx.stroke();
  
  // Inner border shimmer
  cx.strokeStyle='rgba(255,255,255,0.07)';cx.lineWidth=1;
  rr(x+2,y+2,w-4,h-4,r-1);cx.stroke();
  cx.restore();
}

// Premium button with glow
function glowBtn(x,y,w,h,col,label,fs,icon=''){
  const r=Math.min(h*0.38,w/2);
  cx.save();
  // Outer glow
  
  rr(x,y,w,h,r);
  const bg=cx.createLinearGradient(x,y,x,y+h);
  bg.addColorStop(0,colA(col,0.32));bg.addColorStop(1,colA(col,0.08));
  cx.fillStyle=bg;cx.fill();
  cx.shadowBlur=0;
  // Border
  cx.strokeStyle=col;cx.lineWidth=1.5;rr(x,y,w,h,r);cx.stroke();
  // Inner shine
  rr(x+2,y+2,w-4,h*0.44,r*0.7);
  cx.fillStyle='rgba(255,255,255,0.1)';cx.fill();
  // Label
  cx.font=`bold ${fs}px Arial`;cx.textAlign='center';cx.textBaseline='middle';
  
  cx.fillStyle='#ffffff';cx.fillText((icon?icon+' ':'')+label,x+w/2,y+h/2+1);
  cx.shadowBlur=0;
  cx.restore();
}

// Slim progress bar
function progressBar(x,y,w,h,prog,col,bg='rgba(255,255,255,0.08)',r=4){
  rr(x,y,w,h,r);cx.fillStyle=bg;cx.fill();
  if(prog>0.01){
    const fw=Math.max(r*2,(w-2)*prog);
    rr(x+1,y+1,fw,h-2,Math.max(0,r-1));
    const g=cx.createLinearGradient(x,0,x+fw,0);
    g.addColorStop(0,colA(col,0.75));g.addColorStop(1,col);
    cx.fillStyle=g;cx.fill();
    rr(x+1,y+1,fw,Math.floor((h-2)*0.45),Math.max(0,r-1));
    cx.fillStyle='rgba(255,255,255,0.25)';cx.fill();
  }
  cx.strokeStyle='rgba(255,255,255,0.1)';cx.lineWidth=1;
  rr(x,y,w,h,r);cx.stroke();
}

// Coin gem
function coinBadge(x,y,val,size=14){

  cx.font=`bold 10px Arial`;cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#3a1a00';cx.fillText('★',x,y+1);

// ── HUD ────────────────────────────────────────────────────────────────────
function drawHUD(t,z){
  cx.save();
  const CYAN='#00ffff', ORANGE='#ffaa00';
  const FONT="'Orbitron','Trebuchet MS',Arial,sans-serif";

  // ── Rounded panel helper ──────────────────────────────────────────────────
  function panel(x,y,w,h,stroke,r=8){
    rr(x,y,w,h,r);
    cx.fillStyle='rgba(4,16,26,0.88)';cx.fill();
    
    cx.strokeStyle=stroke;cx.lineWidth=1.5;cx.stroke();
    
    // inner highlight strip
    rr(x+2,y+2,w-4,Math.min(h*0.38,14),r-2);
    cx.fillStyle='rgba(255,255,255,0.04)';cx.fill();
  }

  // ── TOP LEFT: Score + Stars ───────────────────────────────────────────────
  const LW=Math.min(W*0.26,105), LH=52, LX=10, LY=10;
  panel(LX,LY,LW,LH,CYAN,8);

  cx.textAlign='left';cx.textBaseline='alphabetic';
  cx.font=`bold 7px ${FONT}`;cx.fillStyle=CYAN+'88';cx.fillText(T_.score,LX+8,LY+14);
  cx.font=`bold ${Math.min(13,LW*0.12)}px ${FONT}`;cx.fillStyle='#ffffff';
  cx.fillText(score.toLocaleString(),LX+8,LY+28);
  cx.font=`bold 7px ${FONT}`;cx.fillStyle=ORANGE+'88';cx.fillText(T_.stars,LX+8,LY+38);
  cx.font=`bold ${Math.min(11,LW*0.1)}px ${FONT}`;
  cx.fillStyle=ORANGE;cx.fillText('★ '+coins.toLocaleString(),LX+8,LY+49);

  // ── TOP RIGHT: Settings (menu) / Pause (game) ────────────────────────────
  const PW=42,PH=42,PX=W-PW-10,PY=10;
  panel(PX,PY,PW,PH,CYAN,8);
  cx.font=`bold ${phase==='MENU'?20:16}px Arial`;cx.textAlign='center';cx.textBaseline='middle';
  cx.fillStyle=CYAN;
  const btnIcon=phase==='MENU'?'⚙':paused?'▶':'⏸';
  cx.fillText(btnIcon,PX+PW/2,PY+PH/2);
  cx.textBaseline='alphabetic';
  regUI('hud_pause',PX,PY,PW,PH);

  // ── Lives (hearts) display — smooth ──────────────────────────────────────
  if(phase==='FLYING'||phase==='ORBITING'){
    const hs=10; // heart size
    const heartGap=6;
    const totalW=maxLives*(hs*2+heartGap)-heartGap;
    const hStartX=PX-totalW-8;
    const hStartY=PY+PH/2;
    for(let i=0;i<maxLives;i++){
      const hx=hStartX+i*(hs*2+heartGap)+hs;
      const filled=i<lives;
      cx.save();cx.translate(hx,hStartY);
      if(filled){
        cx.fillStyle='#ff1a4d';
      } else {
        cx.fillStyle='rgba(255,30,80,0.18)';
      }
      function hudHeart(sz){
        cx.beginPath();
        cx.moveTo(0,sz*0.3);
        cx.bezierCurveTo(sz*0.1,sz*0.1,sz*1.0,-sz*0.15,sz*1.0,-sz*0.55);
        cx.bezierCurveTo(sz*1.0,-sz*1.1,sz*0.35,-sz*1.2,0,-sz*0.8);
        cx.bezierCurveTo(-sz*0.35,-sz*1.2,-sz*1.0,-sz*1.1,-sz*1.0,-sz*0.55);
        cx.bezierCurveTo(-sz*1.0,-sz*0.15,-sz*0.1,sz*0.1,0,sz*0.3);
        cx.closePath();
      }
      hudHeart(hs);cx.fill();
      if(!filled){
        cx.strokeStyle='rgba(255,50,100,0.4)';cx.lineWidth=1;
        hudHeart(hs);cx.stroke();
      } else {
        cx.fillStyle='rgba(255,200,215,0.45)';
        cx.beginPath();cx.ellipse(-hs*0.3,-hs*0.55,hs*0.22,hs*0.13,-0.4,0,Math.PI*2);cx.fill();
      }
      cx.restore();
    }
  }
  // ── TOP CENTER: Zone name ─────────────────────────────────────────────────
  cx.font=`bold ${Math.min(12,W*0.032)}px ${FONT}`;
  cx.textAlign='center';cx.textBaseline='alphabetic';
  cx.fillStyle='rgba(0,255,255,0.55)';
  cx.fillText((T_.zones?T_.zones[z.id]:null)||z.name,W/2,LY+28);

  // ── Pause overlay ─────────────────────────────────────────────────────────
  cx.restore();
}

  regUI('pause_lang_tab',bxFull,ry,bwFull,rowH);

// ── Shop ───────────────────────────────────────────────────────────────────
function drawShop(t,ts){
  cx.save();
  // Rich background
  const sbg=cx.createRadialGradient(W/2,0,0,W/2,H,H);
  sbg.addColorStop(0,'#0e0a1e');sbg.addColorStop(1,'#050310');
  cx.fillStyle=sbg;cx.fillRect(0,0,W,H);

  // Header glass bar
  glassPanel(0,0,W,66,0,'rgba(80,120,255,0.35)',0.92);
  cx.strokeStyle='rgba(80,140,255,0.3)';cx.lineWidth=1;
  cx.beginPath();cx.moveTo(0,66);cx.lineTo(W,66);cx.stroke();

  // Back button
  glowBtn(10,14,82,38,'#4488ff',T_.back,11,'←');
  regUI('shop_back',10,14,82,38);

  // Coins center
  glassPanel(W/2-70,10,140,46,12,'rgba(255,170,0,0.35)');
  coinBadge(W/2-18,33,coins,13);

  // Title
  const tbh=34,tby=70;
  glassPanel(10,tby,W-20,tbh,10,'rgba(80,120,255,0.25)');
  glowText('✦  '+T_.ships+'  ✦',W/2,tby+tbh*0.72,'#aaccff',11,10);

  // Ship grid
  const cols=2,gapX=8,gapY=8;
  const gridX=10,gridY=tby+tbh+8;
  const cardW=Math.floor((W-gridX*2-gapX)/cols);
  const cardH=168;

  SHIPS.forEach((item,i)=>{
    const col2=i%cols,row=Math.floor(i/cols);
    const cxp=gridX+col2*(cardW+gapX),cyp=gridY+row*(cardH+gapY)-shopScroll;
    if(cyp+cardH<gridY-10||cyp>H+10)return;

    const owned=ownedShips.includes(item.id);
    const selected=selShip===item.id;
    const afford=!owned&&coins>=item.price;
    const isPremium=!!item.premium;

    // Card accent color
    const accent=selected?'rgba(80,220,100,0.6)':isPremium?'rgba(255,160,0,0.5)':owned?'rgba(255,170,0,0.3)':'rgba(80,100,200,0.2)';
    glassPanel(cxp,cyp,cardW,cardH,14,accent);

    // Premium card golden shimmer overlay
    if(isPremium&&!owned){
      rr(cxp,cyp,cardW,cardH,14);
      const shimmer=cx.createLinearGradient(cxp,cyp,cxp+cardW,cyp+cardH);
      shimmer.addColorStop(0,'rgba(255,180,0,0.06)');
      shimmer.addColorStop(0.5,'rgba(255,220,80,0.12)');
      shimmer.addColorStop(1,'rgba(255,150,0,0.06)');
      cx.fillStyle=shimmer;cx.fill();
    }
    if(selected){
      rr(cxp,cyp,cardW,cardH,14);
      cx.fillStyle='rgba(50,200,80,0.06)';cx.fill();
    }

    // Ship preview — clip to card area, scale down large ships
    const _sS=Math.min((SHIPS.find(s=>s.id===item.id)?.shopS)||13.33, cardW*0.32);
    const tc2=selected?trailCol(t):isPremium&&!owned?'rgba(255,160,0,0.5)':'rgba(80,120,200,0.7)';
    cx.save();
    cx.beginPath();cx.rect(cxp+4,cyp+4,cardW-8,cardH-8);cx.clip();
    if(isPremium&&!owned)cx.globalAlpha=0.55;
    drawShip(cx,cxp+cardW/2,cyp+58,t*0.45+i*0.8,item.id,tc2,_sS);
    cx.restore();

    // Trail color preview strip
    const trailW=cardW-24,trailH=5,trailX=cxp+12,trailY=cyp+94;
    const tg=cx.createLinearGradient(trailX,0,trailX+trailW,0);
    tg.addColorStop(0,'transparent');tg.addColorStop(0.4,item.trailCol);tg.addColorStop(1,'transparent');
    cx.fillStyle=tg;cx.beginPath();cx.roundRect(trailX,trailY,trailW,trailH,2);cx.fill();

    // Lock icon overlay for premium
    if(isPremium&&!owned){
      cx.font='22px Arial';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillStyle='rgba(255,200,80,0.9)';
      cx.fillText('🔒',cxp+cardW/2,cyp+60);
      cx.textBaseline='alphabetic';
    }

    // Crown badge top-right for premium
    const isAdUnlock=!!item.adUnlock;
    const isDailyLogin=!!item.dailyLogin;
    const isWeeklyReward=!!item.weeklyReward;
    if(isPremium){
      const badgeX=cxp+cardW-22,badgeY=cyp+6;
      rr(badgeX,badgeY,18,18,5);
      const bg=cx.createLinearGradient(badgeX,badgeY,badgeX+18,badgeY+18);
      bg.addColorStop(0,'#ffcc00');bg.addColorStop(1,'#ff8800');
      cx.fillStyle=bg;cx.fill();
      cx.font='11px Arial';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillStyle='#3a1a00';cx.fillText('👑',badgeX+9,badgeY+9);
      cx.textBaseline='alphabetic';
    }
    if(isAdUnlock&&!owned){
      const badgeX=cxp+cardW-22,badgeY=cyp+6;
      rr(badgeX,badgeY,18,18,5);
      cx.fillStyle='#2244aa';cx.fill();
      cx.font='9px Arial';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillStyle='#aaddff';cx.fillText('📺',badgeX+9,badgeY+9);
      cx.textBaseline='alphabetic';
    }
    if(isDailyLogin&&!owned){
      const badgeX=cxp+cardW-22,badgeY=cyp+6;
      rr(badgeX,badgeY,18,18,5);
      cx.fillStyle='#aa6600';cx.fill();
      cx.font='9px Arial';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillStyle='#ffcc44';cx.fillText('📅',badgeX+9,badgeY+9);
      cx.textBaseline='alphabetic';
    }

    // Name
    if(isWeeklyReward&&!owned){
      const badgeX=cxp+cardW-22,badgeY=cyp+6;
      rr(badgeX,badgeY,18,18,5);
      const wbg=cx.createLinearGradient(badgeX,badgeY,badgeX+18,badgeY+18);
      wbg.addColorStop(0,'#ffd700');wbg.addColorStop(1,'#ff8800');
      cx.fillStyle=wbg;cx.fill();
      cx.font='9px Arial';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillStyle='#3a1a00';cx.fillText('🏆',badgeX+9,badgeY+9);
      cx.textBaseline='alphabetic';
    }
    const nameCol=selected?'#88ffaa':isPremium?'#ffcc44':isWeeklyReward?'#ffd700':isAdUnlock&&!owned?'#aaddff':isDailyLogin&&!owned?'#ffcc44':owned?'#ffe080':'rgba(180,200,255,0.85)';
    glowText(shipName(item.id),cxp+cardW/2,cyp+100,nameCol,10,selected?8:0);

    // Ad progress bar
    const shipWatched=adWatchesPerShip[item.id]||0;
    if(isAdUnlock&&!owned){
      const prog=shipWatched/item.adUnlock;
      const barX=cxp+8,barY=cyp+106,barW=cardW-16,barH=6;
      rr(barX,barY,barW,barH,3);cx.fillStyle='rgba(0,20,60,0.6)';cx.fill();
      if(prog>0){rr(barX,barY,Math.max(4,barW*prog),barH,3);cx.fillStyle='#4488ff';cx.fill();}
      cx.font='bold 7px Arial';cx.textAlign='center';cx.textBaseline='alphabetic';
      cx.fillStyle='rgba(150,200,255,0.7)';
      cx.fillText(`${shipWatched}/${item.adUnlock} 📺`,cxp+cardW/2,cyp+120);
    }
    // Weekly reward info
    if(isWeeklyReward&&!owned){
      cx.font='bold 7px Arial';cx.textAlign='center';cx.textBaseline='alphabetic';
      cx.fillStyle='rgba(255,215,0,0.75)';
      cx.fillText(T_.weeklyRewardSub||'Awarded to #1 each week',cxp+cardW/2,cyp+120);

    // Button
    const btnW=cardW-16,btnH=32,btnX=cxp+8,btnY=cyp+cardH-40;
    if(selected){
      glowBtn(btnX,btnY,btnW,btnH,'#33dd77',T_.selected,10,'✓');
    } else if(owned){
      glowBtn(btnX,btnY,btnW,btnH,'#4488ff',T_.select,11);
      regUI('buy_ship_'+item.id,btnX,btnY,btnW,btnH);

        regUI('buy_ship_'+item.id,btnX,btnY,btnW,btnH);

      glowBtn(btnX,btnY,btnW,btnH,'rgba(120,80,0,0.5)',T_.weeklyReward||'🏆 WEEKLY REWARD',8);
    } else if(isDailyLogin){
      const done=loginStreak>=item.dailyLogin;
      if(done){
        glowBtn(btnX,btnY,btnW,btnH,'#ffaa00',T_.unlockShip,10,'🔓');        regUI('buy_ship_'+item.id,btnX,btnY,btnW,btnH);

      regUI('buy_ship_'+item.id,btnX,btnY,btnW,btnH);

      glowBtn(btnX,btnY,btnW,btnH,'#ffaa22',item.price.toLocaleString()+'  ★',10);
